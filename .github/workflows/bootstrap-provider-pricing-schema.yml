name: Bootstrap provider pricing D1 schema

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create missing provider pricing tables and indexes in remote D1."
        required: false
        type: boolean
        default: false
      database:
        description: "D1 database name."
        required: false
        default: "tourticketcompare-demand"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      D1_DATABASE_NAME: ${{ inputs.database }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare D1 configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi

      - name: Preview mode
        if: ${{ !inputs.apply }}
        run: |
          echo "Schema bootstrap is in preview mode. Re-run with apply=true to create only missing tables and indexes."

      - name: Bootstrap missing provider pricing tables
        if: ${{ inputs.apply }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute "${D1_DATABASE_NAME}" --remote --file migrations/0007_bootstrap_provider_pricing_schema.sql
