name: Candidate Audit

on:
  workflow_dispatch:  # Manual trigger only (MVP — cron reserved for Phase 2)

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create audit directory
        run: mkdir -p .audit

      - name: Query Ticketmaster Discovery API
        id: audit
        continue-on-error: true
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          if [ -z "$TICKETMASTER_API_KEY" ]; then
            echo "TICKETMASTER_API_KEY not configured; using --dry-run mode"
            npm run audit:candidates -- --dry-run --output .audit/candidates-raw.json
          else
            npm run audit:candidates -- --api-key="$TICKETMASTER_API_KEY" --output .audit/candidates-raw.json
          fi

      - name: Score and rank candidates
        id: score
        continue-on-error: true
        run: |
          node scripts/score-candidates.mjs \
            --input .audit/candidates-raw.json \
            --artists public/data/artists.json \
            --output .audit/candidates.json

      - name: Generate markdown report
        id: report
        continue-on-error: true
        run: |
          node scripts/report-candidates.mjs \
            --input .audit/candidates.json \
            --output .audit/candidates-report.md

      - name: Display report
        if: always()
        run: |
          if [ -f .audit/candidates-report.md ]; then
            echo "=== Candidate Report ==="
            cat .audit/candidates-report.md
          else
            echo "No report generated."
          fi

      - name: List .audit directory
        if: always()
        run: |
          echo "=== .audit directory listing ==="
          ls -la .audit || echo ".audit directory not found"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates-audit-${{ github.run_id }}
          path: .audit/**
          if-no-files-found: warn
          retention-days: 30
