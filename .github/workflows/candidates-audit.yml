name: Candidate Audit

on:
  workflow_dispatch:  # Manual trigger only (MVP — cron reserved for Phase 2)
    inputs:
      pages:
        description: 'Pages of 200 events to fetch (1–25). Conservative default is 5; increase to widen the scan window so major tours scheduled further out are less likely to be missed.'
        required: false
        default: '5'
        type: string
      mode:
        description: 'Search mode: "default" keeps source=ticketmaster; "broad" drops the source filter to include syndicated music events on TM hostnames.'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - broad

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create audit directory
        run: mkdir -p .audit

      - name: Query Ticketmaster Discovery API
        id: audit
        continue-on-error: true
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          AUDIT_PAGES: ${{ github.event.inputs.pages || '5' }}
          AUDIT_MODE: ${{ github.event.inputs.mode || 'default' }}
        run: |
          if [ -z "$TICKETMASTER_API_KEY" ]; then
            echo "TICKETMASTER_API_KEY not configured; using --dry-run mode"
            npm run audit:candidates -- --dry-run --pages "$AUDIT_PAGES" --mode "$AUDIT_MODE" --output .audit/candidates-raw.json
          else
            npm run audit:candidates -- --api-key="$TICKETMASTER_API_KEY" --pages "$AUDIT_PAGES" --mode "$AUDIT_MODE" --output .audit/candidates-raw.json
          fi

      - name: Score and rank candidates
        id: score
        continue-on-error: true
        run: |
          node scripts/score-candidates.mjs \
            --input .audit/candidates-raw.json \
            --artists public/data/artists.json \
            --output .audit/candidates.json

      - name: Generate markdown report
        id: report
        continue-on-error: true
        run: |
          node scripts/report-candidates.mjs \
            --input .audit/candidates.json \
            --output .audit/candidates-report.md

      - name: Display report
        if: always()
        run: |
          if [ -f .audit/candidates-report.md ]; then
            echo "=== Candidate Report ==="
            cat .audit/candidates-report.md
          else
            echo "No report generated."
          fi

      - name: List .audit directory
        if: always()
        run: |
          echo "=== .audit directory listing ==="
          ls -la .audit || echo ".audit directory not found"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates-audit-${{ github.run_id }}
          path: |
            .audit/candidates-raw.json
            .audit/candidates.json
            .audit/candidates-report.md
          if-no-files-found: warn
          retention-days: 30
