name: Content Build

# Compiles content/blog/*.md and content/guides/*.md into the generated files
# the live site reads, and commits the result — which is what makes a post or a
# guide appear.
#
# Why this exists: Cloudflare Pages serves public/ with no build step, so
# nothing else would ever compile the Markdown. The browser editor at /admin
# commits Markdown and stops; this job finishes the job.
#
# Scope is deliberately narrow. It writes FOUR generated, machine-owned files
# and nothing else:
#
#   public/data/blog-content.json          compiled from content/blog/*.md
#   public/data/guides-content.json        compiled from content/guides/*.md
#   functions/_guide-routes.generated.js   published guide routes + the router's
#                                          event-price fallback literal
#   data/content-provenance.json           each page's copy fingerprint, its
#                                          derived lastmod, and the immutable
#                                          first-publication ledger
#
# It never touches event, artist, catalog, provider, pricing, redirect or
# affiliate data, and it never writes content/**: the Markdown is human-authored
# and a bot commit there would race an editor's save. The commit happens only
# after the full validation suite has passed in this same job, on exactly the
# content it is about to publish, and only after the diff has been proved to
# contain nothing outside the four paths above. A failure leaves main unchanged
# and fails loudly.

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'content/guides/**'
      # Hand-authored guide display order. Distinct from the data/ file this job
      # commits, so a bot commit cannot re-trigger the workflow.
      - 'data/guide-order.json'
      - 'scripts/build-blog-content.mjs'
      - 'scripts/build-guide-content.mjs'
      - 'scripts/sync-content-provenance.mjs'
      - 'scripts/lib/content-markdown.mjs'
      - 'functions/_blog.js'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate without committing'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  # Publishing goes through an auto-merged PR whose head must carry the
  # `test-mvp` required status check; earning it means dispatching Prelaunch
  # Validation against the pushed branch.
  actions: write

concurrency:
  group: content-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The retry path below re-runs the whole validation suite against the new
    # base rather than pushing an unvalidated rebuild, so the budget has to
    # cover more than one pass.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- writers ------------------------------------------------------
      # Everything that can modify a file runs here, before any validation.
      # Nothing below this block writes, so what is validated is exactly what
      # is committed.
      #
      # Order matters and converges in one pass: the guide build compiles the
      # Markdown, the provenance sync fingerprints that compiled output and
      # advances lastmod only where the copy actually changed, and the final
      # guide build folds any advanced date back into the generated route
      # module. The fingerprint excludes datePublished and lastmod, so the hash
      # cannot change as a result of the value it determines — the third build
      # is a no-op by construction, and `guides:check` in the suite below
      # proves it.
      - name: Compile content and refresh provenance
        run: |
          npm run guides:build
          npm run blog:build
          npm run content:provenance
          npm run guides:build

      - name: Report what changed
        id: changed
        run: |
          if git diff --quiet -- \
            public/data/blog-content.json \
            public/data/guides-content.json \
            functions/_guide-routes.generated.js \
            data/content-provenance.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change: the committed output already matches content/."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      # --- validation ---------------------------------------------------
      # The generated files are inputs to the router, the sitemap, llms.txt and
      # both site audits, so they go through the same gate as any other change
      # to published content — before the commit, not after.
      - name: Run canonical validation suite
        if: steps.changed.outputs.changed == 'true'
        run: npm run test:mvp

      - name: Validate rendered head + JSON-LD schema contract
        if: steps.changed.outputs.changed == 'true'
        run: npm run schema:validate

      - name: Audit the indexable surface against its baseline
        if: steps.changed.outputs.changed == 'true'
        run: npm run audit:indexable-surface:check

      - name: Check patch whitespace
        if: steps.changed.outputs.changed == 'true'
        run: git diff --check

      # `git add <paths>` only decides what is staged; it says nothing about
      # what the build actually touched. This proves the working tree contains
      # no change outside the four allowlisted outputs, so a compiler bug — or
      # a future edit to this workflow — cannot quietly ship a fifth file.
      - name: Assert the diff contains only allowlisted files
        if: steps.changed.outputs.changed == 'true'
        run: ./.github/workflows/scripts/assert-diff-allowlist.sh
          public/data/blog-content.json
          public/data/guides-content.json
          functions/_guide-routes.generated.js
          data/content-provenance.json

      # --- publish (no writer runs after this point) --------------------
      # The validation suite above takes minutes, and the scheduled sync lanes
      # (daily-audit, nightly-data-sync, the provider syncs) publish to main
      # independently, so the tree this job validated is rarely still the tip.
      #
      # Publishing through a squash-merged PR absorbs that: GitHub merges onto
      # whatever main now carries, and `main`'s required `test-mvp` check —
      # which a runner-built commit cannot satisfy on a direct push — is earned
      # by dispatching the real validation workflow against the pushed branch
      # (scripts/open-automation-pr.mjs).
      #
      # A merge can still be withheld, most plausibly on a genuine conflict in
      # public/data/guides-content.json, which the daily audit also writes. On
      # that, reset onto the new main, re-run the whole writer + validation
      # pipeline against the content main now carries, and retry once —
      # re-validating is the point, since another lane may have changed the
      # artist data a guide's links resolve against. Nothing would otherwise
      # rebuild that Markdown, and an /admin save could sit unpublished
      # indefinitely.
      - name: Publish the compiled content
        if: steps.changed.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="automation/content-build-${TODAY}"
          git config user.name "tourticketcompare-bot"
          git config user.email "tourticketcompare-bot@users.noreply.github.com"

          stage_and_commit() {
            git add public/data/blog-content.json \
                    public/data/guides-content.json \
                    functions/_guide-routes.generated.js \
                    data/content-provenance.json
            git commit -m "content: rebuild blog and guide content from content/"
          }

          git checkout -B "$BRANCH"
          stage_and_commit

          for attempt in 1 2; do
            git push -u origin "$BRANCH" --force-with-lease
            if BRANCH="$BRANCH" \
               PR_TITLE="content: rebuild blog and guide content from content/" \
               PR_LABEL="automation:content-build" \
               PR_AUTO_MERGE=true \
               PR_BODY=$'## What this PR does\n- Recompiles `content/blog/*.md` and `content/guides/*.md` into the four generated files the live site reads: `public/data/blog-content.json`, `public/data/guides-content.json`, `functions/_guide-routes.generated.js` and `data/content-provenance.json`.\n- This is what makes a post or a guide actually appear: Cloudflare Pages serves `public/` with no build step.\n\n## Explicit non-changes\n- Never writes `content/**` — the Markdown is human-authored.\n- No event, artist, catalog, provider, pricing, redirect or affiliate data.\n\n## Validation\n- `npm run test:mvp`, `npm run schema:validate`, `npm run audit:indexable-surface:check`, `git diff --check` and the diff allowlist all passed in-job on exactly this content, and Prelaunch Validation runs again on this branch before the merge.\n' \
               node scripts/open-automation-pr.mjs; then
              echo "Published the rebuilt content (attempt ${attempt})."
              exit 0
            fi

            echo "::warning::publish withheld on attempt ${attempt}; rebuilding against the current main tip."
            sleep $((attempt * 5))
            git fetch origin main
            git reset --hard origin/main

            npm run guides:build
            npm run blog:build
            npm run content:provenance
            npm run guides:build

            if git diff --quiet -- \
              public/data/blog-content.json \
              public/data/guides-content.json \
              functions/_guide-routes.generated.js \
              data/content-provenance.json; then
              echo "::notice::main already carries an equivalent rebuild; nothing left to publish."
              exit 0
            fi

            npm run test:mvp
            npm run schema:validate
            npm run audit:indexable-surface:check
            git diff --check
            ./.github/workflows/scripts/assert-diff-allowlist.sh \
              public/data/blog-content.json \
              public/data/guides-content.json \
              functions/_guide-routes.generated.js \
              data/content-provenance.json

            stage_and_commit
          done

          echo "::error::Could not publish the rebuilt content after 2 attempts. The PR is open for a human; re-run this workflow to retry."
          exit 1

      - name: Report dry run
        if: steps.changed.outputs.changed == 'true' && github.event.inputs.dry_run == 'true'
        run: echo "::notice::Dry run — validation passed and the rebuild was not committed."
