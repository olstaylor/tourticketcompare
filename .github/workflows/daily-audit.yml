name: Daily data audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip commit/push/PR; produce candidate diff only.'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p .audit

      # Storefront HTTP liveness checks were removed: Ticketmaster/SeatGeek sit
      # behind anti-bot WAFs that 403 CI runners, so the check could never
      # confirm a live link, and scraping is against project policy. Link
      # verification is now done via the official provider APIs below.

      - name: TM Discovery diff
        id: tm
        continue-on-error: true
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          if [ -z "$TICKETMASTER_API_KEY" ]; then
            echo "TICKETMASTER_API_KEY not configured; skipping TM diff."
            printf '%s\n' '{"status":"skipped","reason":"TICKETMASTER_API_KEY not set"}' > .audit/tm-status.json
            exit 0
          fi
          if node scripts/audit-tm-events.mjs --json .audit/tm.json; then
            printf '%s\n' '{"status":"ok"}' > .audit/tm-status.json
          else
            code=$?
            printf '%s\n' "{\"status\":\"failed\",\"reason\":\"audit-tm-events.mjs exited ${code}\"}" > .audit/tm-status.json
            exit $code
          fi

      - name: SeatGeek Discovery diff
        id: sg
        continue-on-error: true
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
        run: |
          if [ -z "$SEATGEEK_CLIENT_ID" ]; then
            echo "SEATGEEK_CLIENT_ID not configured; skipping SeatGeek diff."
            printf '%s\n' '{"status":"skipped","reason":"SEATGEEK_CLIENT_ID not set"}' > .audit/sg-status.json
            exit 0
          fi
          if node scripts/audit-seatgeek-events.mjs --json .audit/sg.json; then
            printf '%s\n' '{"status":"ok"}' > .audit/sg-status.json
          else
            code=$?
            printf '%s\n' "{\"status\":\"failed\",\"reason\":\"audit-seatgeek-events.mjs exited ${code}\"}" > .audit/sg-status.json
            exit $code
          fi

      - name: Update rolling audit issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/daily-audit-report.mjs \
            --tm .audit/tm.json \
            --sg .audit/sg.json \
            --repo "${GITHUB_REPOSITORY}"

      - name: Upload audit artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-audit-${{ github.run_id }}
          path: .audit/
          # .audit is a dotfile dir; upload-artifact@v4 excludes hidden files
          # by default, which would skip the upload and break the download in
          # the verification-dates job.
          include-hidden-files: true
          retention-days: 30

  verification-dates:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download audit artefacts
        uses: actions/download-artifact@v4
        with:
          name: daily-audit-${{ github.run_id }}
          path: .audit

      - name: Bump verified dates for clean artists
        id: bump
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Dry-run mode: artists.json will not be modified and no PR will be opened."
          fi
          node scripts/bump-verified-dates.mjs \
            --tm .audit/tm.json \
            --tm-status .audit/tm-status.json \
            --sg .audit/sg.json \
            --sg-status .audit/sg-status.json \
            $DRY_RUN_FLAG

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- public/data/artists.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch and open daily PR
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="automation/verified-dates-${TODAY}"
          git config user.name "tourticketcompare-bot"
          git config user.email "tourticketcompare-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/data/artists.json
          git commit -m "Bump last_verified_at for clean artists (${TODAY})"
          git push -u origin "$BRANCH" --force-with-lease
          BRANCH="$BRANCH" TODAY="$TODAY" node scripts/open-daily-pr.mjs
