name: Daily data audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip commit/push/PR; produce candidate diff only.'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p .audit

      - name: URL liveness check
        id: links
        continue-on-error: true
        run: node scripts/verify-outbound-links.mjs --json .audit/links.json

      - name: TM Discovery diff
        id: tm
        continue-on-error: true
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          if [ -z "$TICKETMASTER_API_KEY" ]; then
            echo "TICKETMASTER_API_KEY not configured; skipping TM diff."
            printf '%s\n' '{"status":"skipped","reason":"TICKETMASTER_API_KEY not set"}' > .audit/tm-status.json
            exit 0
          fi
          if node scripts/audit-tm-events.mjs --json .audit/tm.json; then
            printf '%s\n' '{"status":"ok"}' > .audit/tm-status.json
          else
            code=$?
            printf '%s\n' "{\"status\":\"failed\",\"reason\":\"audit-tm-events.mjs exited ${code}\"}" > .audit/tm-status.json
            exit $code
          fi

      # Confirms each guide's cited source URL still resolves. Runs here, in the
      # job that publishes the rolling issue and uploads .audit/, so a broken
      # citation is actually delivered for human follow-up instead of dying in
      # this step's log. --dry-run because the sidecar is written from the
      # verification-dates job, which applies these verdicts via --from-report
      # rather than probing every URL a second time.
      - name: Check guide source links
        id: guide_sources
        continue-on-error: true
        run: node scripts/check-guide-source-links.mjs --dry-run --json .audit/guide-sources.json

      - name: Update rolling audit issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/daily-audit-report.mjs \
            --links .audit/links.json \
            --tm .audit/tm.json \
            --guide-sources .audit/guide-sources.json \
            --repo "${GITHUB_REPOSITORY}"

      - name: Upload audit artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-audit-${{ github.run_id }}
          path: .audit/
          # .audit is a dotfile dir; upload-artifact@v4 excludes hidden files
          # by default, which would skip the upload and break the download in
          # the verification-dates job.
          include-hidden-files: true
          retention-days: 30

  verification-dates:
    runs-on: ubuntu-latest
    needs: audit
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download audit artefacts
        uses: actions/download-artifact@v4
        with:
          name: daily-audit-${{ github.run_id }}
          path: .audit

      - name: Bump verified dates for clean artists
        id: bump
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Dry-run mode: artists.json will not be modified and no PR will be opened."
          fi
          node scripts/bump-verified-dates.mjs \
            --links .audit/links.json \
            --tm .audit/tm.json \
            --tm-status .audit/tm-status.json \
            $DRY_RUN_FLAG

      # Confirms each guide's cited source URL still resolves and records the
      # result in data/guide-source-link-checks.json, then rebuilds
      # public/data/guides-content.json from it.
      #
      # Deliberately narrow in three ways. It never touches the editorial
      # `last_checked` in content/guides/*.md — only a human may set that, and
      # this job never writes content/** at all. 401/403/429 is treated as
      # "blocked, not verified" exactly as the artist link audit does, so a WAF
      # challenge never produces a fresh timestamp. And the recorded dates are
      # excluded from the content fingerprint, so this cannot move a guide's
      # published "Updated" date — asserted outright further down.
      #
      # Applies the verdicts the audit job already established. No network, so a
      # URL cannot be reported one way upstream and stamped another way here.
      - name: Stamp checked guide source links
        continue-on-error: true
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          node scripts/check-guide-source-links.mjs --from-report .audit/guide-sources.json $DRY_RUN_FLAG

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- public/data/artists.json public/data/guides-content.json data/guide-source-link-checks.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate inline fallback for bumped artists
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Keep the inlined public/index.html fallback in sync with the bumped
          # artists.json so the direct-to-main commit never drifts the fallback
          # (this replaces the stale-sync-guard the old PR flow relied on).
          python3 scripts/sync-events-data.py

      # The bump moves last_verified_at in artists.json, which PROJECT_STATUS.md's
      # per-artist table mirrors. Refreshing it here is what keeps the two in
      # step: before this, the table was hand-copied and drifted nine rows.
      #
      # This is a WRITER, so it runs before the validation block below and not
      # after it. Anything that modifies a file after `npm run test:mvp` and
      # `git diff --check` would be committing content those checks never saw.
      - name: Refresh the per-artist table from source
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/validate-status-counts.mjs --write

      # --- validation (no writer runs after this point) -------------------
      #
      # Validation gates the commit: if any check fails, nothing is pushed.
      # last_verified_at is bumped ONLY for artists whose URL liveness + TM
      # Discovery diff came back clean, so this is a lossless freshness-timestamp
      # write — committed straight to main under the same in-job-validation model
      # as the nightly field-sync (SAFE_PUBLISHING_RULES.md, owner-approved
      # 2026-07-28). The old daily human-review PR flow is retired: no
      # automation/verified-dates-* branch or PR is opened.
      - name: Validate before commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run test:mvp
          git diff --check

      # A link check proves a URL resolved. It must not be able to prove
      # anything else. The generated route module carries every guide's
      # published and updated dates, and the provenance state carries the
      # fingerprints and the first-publication ledger; if stamping a link check
      # ever perturbed either, this job stops instead of committing.
      - name: Assert the link check moved no published date
        if: steps.diff.outputs.changed == 'true'
        run: |
          if ! git diff --quiet -- functions/_guide-routes.generated.js data/content-provenance.json; then
            echo "::error::the nightly link check changed a generated route table or the provenance state."
            git --no-pager diff -- functions/_guide-routes.generated.js data/content-provenance.json
            exit 1
          fi
          echo "No published or updated date moved."

      - name: Assert the diff contains only allowlisted files
        if: steps.diff.outputs.changed == 'true'
        run: ./.github/workflows/scripts/assert-diff-allowlist.sh
          public/data/artists.json
          data/guide-source-link-checks.json
          public/data/guides-content.json
          public/index.html
          PROJECT_STATUS.md

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "tourticketcompare-bot"
          git config user.email "tourticketcompare-bot@users.noreply.github.com"
          git add public/data/artists.json data/guide-source-link-checks.json public/data/guides-content.json public/index.html PROJECT_STATUS.md
          git commit -m "Bump verification timestamps (${TODAY})"
          git push origin HEAD:main

  # The generated PROJECT_STATUS.md figures — route surface and empty-board list
  # — move with the calendar, not with a data edit: a date passing is enough to
  # change them on a day nothing was committed. So this job runs daily and
  # independently.
  #
  # `if: always()` and no dependency on the audit's *result* are deliberate. The
  # audit job has previously hit the former 25-minute cap on real days (see
  # docs/OPERATIONS.md -> Known incidents), and neither writer reads its artefacts —
  # both recount from the repository. Tying doc freshness to the flakiest job in
  # the workflow is exactly the coupling this is meant to remove. It is ordered
  # after verification-dates only so the two pushes to main cannot race.
  status-figures:
    runs-on: ubuntu-latest
    needs: [audit, verification-dates]
    if: always() && inputs.dry_run != true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # verification-dates may have pushed to main minutes ago in this same run.
      # This job checked out the run's original SHA, so regenerating from that
      # tree would recompute the per-artist table from PRE-bump artists.json and
      # push a commit that undoes the bump's own record of itself. Starting from
      # the tip removes that race entirely — and removes the need to rebase a
      # commit built on a stale base.
      - name: Sync to the tip of main
        run: |
          git fetch origin main
          git checkout -B status-figures origin/main

      - name: Refresh generated figures
        run: |
          # Data-derived counts (sub-second read of the data files), then the
          # calendar-derived route surface and empty-board list, which need the
          # audit's own render of every route to read robots meta truthfully.
          node scripts/validate-status-counts.mjs --write
          npm run status:surface:write
          # The command above also refreshes the human-readable and JSON
          # evidence reports. They are intentionally not committed by this
          # job: their generated_at timestamp would create daily churn. Restore
          # those two evidence files before the allowlist check; the status
          # figures remain the only persisted output of this job.
          git restore --source=HEAD -- reports/indexable-surface/indexable-surface.json reports/indexable-surface/indexable-surface.md

      - name: Check for changes
        id: diff
        run: |
          # PROJECT_STATUS.md only. The regenerated reports/indexable-surface/
          # files carry a generated_at stamp that changes every run, so
          # committing them daily would be pure churn; they are evidence,
          # regenerated on demand, not state.
          if git diff --quiet -- PROJECT_STATUS.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Same in-job-validation model as every other direct-to-main write here:
      # if anything fails, nothing is pushed.
      - name: Validate before commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run test:mvp
          git diff --check

      - name: Assert the diff contains only allowlisted files
        if: steps.diff.outputs.changed == 'true'
        run: ./.github/workflows/scripts/assert-diff-allowlist.sh PROJECT_STATUS.md

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "tourticketcompare-bot"
          git config user.email "tourticketcompare-bot@users.noreply.github.com"
          git add PROJECT_STATUS.md
          git commit -m "Refresh generated status figures (${TODAY})"
          # HEAD is origin/main plus this one commit (see "Sync to the tip"), so
          # this is a fast-forward. If someone pushed in between it is rejected
          # rather than forced — the writers are idempotent, so the next run
          # simply redoes the work.
          git push origin HEAD:main
