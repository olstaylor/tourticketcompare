name: Artist date alerts

# Sends the one-off "dates are now listed" email to watchlist signups whose
# artist now has upcoming dates (scripts/send-date-alerts.mjs). Manual only:
# there is deliberately no schedule until the owner has reviewed a test send
# and decided to run it automatically.
#
# preview  counts due alerts per artist; sends and writes nothing
# test     sends one sample to test_to; records nothing
# send     sends due alerts, up to `limit` per run, and records each in D1 so no
#          one is emailed twice; the log says when more are left, so run it again

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview, test or send"
        required: true
        type: choice
        options: [preview, test, send]
        default: preview
      test_to:
        description: "Recipient for a test send"
        required: false
        default: ""
      artist:
        description: "Artist slug for a test send (optional)"
        required: false
        default: ""
      limit:
        description: "Most alerts one send run emails (rerun to send the rest)"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: date-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run date alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_POSTAL_ADDRESS: ${{ secrets.ALERT_POSTAL_ADDRESS }}
          ALERT_REPLY_TO: ${{ secrets.ALERT_REPLY_TO }}
          MODE: ${{ inputs.mode }}
          TEST_TO: ${{ inputs.test_to }}
          ARTIST: ${{ inputs.artist }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--mode "$MODE" --limit "${LIMIT:-500}")
          if [ "$MODE" = "test" ]; then
            args+=(--test-to "$TEST_TO")
            if [ -n "$ARTIST" ]; then args+=(--artist "$ARTIST"); fi
          fi
          node scripts/send-date-alerts.mjs "${args[@]}"
