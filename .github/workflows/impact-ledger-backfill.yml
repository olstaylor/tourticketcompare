name: Impact ledger backfill

# Manual only. Runs scripts/sync-impact-action-ledger.mjs with a chosen start
# date and an optional dry run (reads Impact and D1, writes nothing). The nightly
# job in funnel-daily.yml keeps the ledger current; this is for the one-off
# backfill of older orders (Impact returns about 12 months). See
# docs/COMMERCIAL_FUNNEL.md, "Impact order ledger". No schedule.

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Start date YYYY-MM-DD (empty = last 45 days)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: write nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: impact-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import Impact orders
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID || secrets.IMPACT_VIVIDSEATS_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN || secrets.IMPACT_VIVIDSEATS_AUTH_TOKEN }}
          IMPACT_SEATGEEK_CAMPAIGN_ID: ${{ secrets.IMPACT_SEATGEEK_CAMPAIGN_ID }}
          IMPACT_SEATGEEK_PROGRAM_ID: ${{ secrets.IMPACT_SEATGEEK_PROGRAM_ID }}
          IMPACT_VIVIDSEATS_CAMPAIGN_ID: ${{ secrets.IMPACT_VIVIDSEATS_CAMPAIGN_ID }}
          IMPACT_VIVIDSEATS_PROGRAM_ID: ${{ secrets.IMPACT_VIVIDSEATS_PROGRAM_ID }}
          IMPACT_TICKETNETWORK_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETNETWORK_CAMPAIGN_ID }}
          IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID }}
          IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          args=()
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          node scripts/sync-impact-action-ledger.mjs "${args[@]}" --markdown "$RUNNER_TEMP/ledger.md"
          code=$?
          [ -s "$RUNNER_TEMP/ledger.md" ] && cat "$RUNNER_TEMP/ledger.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
