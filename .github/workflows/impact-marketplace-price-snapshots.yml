name: Impact marketplace price snapshots

# Reads exact provider event IDs already stored by the event sync and writes
# only unambiguous, timestamped D1 snapshots. The verified TicketNetwork and
# StubHub International lanes refresh every two hours; Ticket Liquidator is
# manual-only while its catalog has no numeric CurrentPrice.
#
# Cadence rationale (2026-07-30): measured against provider_pricing_history,
# listed prices drift ~2.3%/hour, so the per-snapshot change rate scales with
# the interval rather than flattening — a widened cron shows visitors staler
# prices, it does not skip redundant writes. A two-hour cron puts the average
# displayed price ~1h behind the provider. Actions minutes are not the budget
# here (this repo is public, so standard runners are free); the Impact request
# volume is: one catalog request per verified event, ~400 per scheduled run
# across the two lanes.

on:
  # A change to the runtime/provider contract also bootstraps fresh rows on
  # main, so a newly activated lane does not wait for the next cron tick.
  push:
    branches: [main]
    paths:
      - '.github/workflows/impact-marketplace-price-snapshots.yml'
      - 'functions/_impact-marketplace-config.js'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to snapshot
        type: choice
        options: [ticketnetwork, ticket-liquidator, stubhub-international]
        required: true
      apply:
        description: Write to remote D1 (false is a read-only dry run)
        type: boolean
        default: false
      limit:
        description: Optional maximum eligible events
        type: string
        required: false
        default: ''
      event_id:
        description: Optional single local event ID
        type: string
        required: false
        default: ''
      database:
        description: D1 database name
        type: string
        default: tourticketcompare-demand

permissions:
  contents: read

concurrency:
  group: impact-marketplace-price-snapshots-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.provider || 'scheduled' }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # A healthy leg finishes in ~2-3 min; the fast-fail request timeout in the
    # snapshot script keeps a stalled provider from ever approaching this cap.
    timeout-minutes: 10
    env:
      # Both scheduled lanes run sequentially in one job so checkout, npm ci and
      # the self-test are paid once per run instead of once per provider.
      PROVIDERS_TO_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.provider || 'ticketnetwork stubhub-international' }}
      APPLY: ${{ github.event_name != 'workflow_dispatch' && 'true' || github.event.inputs.apply }}
      LIMIT: ${{ github.event.inputs.limit || '' }}
      EVENT_ID: ${{ github.event.inputs.event_id || '' }}
      DATABASE: ${{ github.event.inputs.database || 'tourticketcompare-demand' }}
      IMPACT_CATALOG_PROXY_URL: https://tourticketcompare.com/api/impact/products
      # /api/impact/products is token-gated; without this the proxy returns 404.
      IMPACT_CATALOG_PROXY_TOKEN: ${{ secrets.DEBUG_API_TOKEN }}
      IMPACT_CATALOG_CREDENTIAL_SET: seatgeek
      IMPACT_CATALOG_API_VERSION: '16'
      IMPACT_TICKETNETWORK_ACCOUNT_SID: ${{ secrets.IMPACT_TICKETNETWORK_ACCOUNT_SID }}
      IMPACT_TICKETNETWORK_AUTH_TOKEN: ${{ secrets.IMPACT_TICKETNETWORK_AUTH_TOKEN }}
      IMPACT_TICKETNETWORK_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETNETWORK_CAMPAIGN_ID }}
      IMPACT_TICKETNETWORK_CATALOG_ID: ${{ secrets.IMPACT_TICKETNETWORK_CATALOG_ID }}
      IMPACT_TICKETNETWORK_PROGRAM_ID: ${{ secrets.IMPACT_TICKETNETWORK_PROGRAM_ID }}
      IMPACT_TICKETLIQUIDATOR_ACCOUNT_SID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_ACCOUNT_SID }}
      IMPACT_TICKETLIQUIDATOR_AUTH_TOKEN: ${{ secrets.IMPACT_TICKETLIQUIDATOR_AUTH_TOKEN }}
      IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID }}
      IMPACT_TICKETLIQUIDATOR_CATALOG_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_CATALOG_ID }}
      IMPACT_TICKETLIQUIDATOR_PROGRAM_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_PROGRAM_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_ACCOUNT_SID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_ACCOUNT_SID }}
      IMPACT_STUBHUB_INTERNATIONAL_AUTH_TOKEN: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_AUTH_TOKEN }}
      IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_CATALOG_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_CATALOG_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_PROGRAM_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_PROGRAM_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run impact-providers:prices:self-test
      - run: npm run prices:history:prune:self-test

      - name: Snapshot exact verified event prices
        run: |
          set -uo pipefail
          status=0
          for PROVIDER in $PROVIDERS_TO_RUN; do
            echo "::group::Snapshot ${PROVIDER}"
            args=(--provider "$PROVIDER" --database "$DATABASE" --json)
            if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
            if [ -n "$EVENT_ID" ]; then args+=(--event-id "$EVENT_ID"); fi
            if [ "$APPLY" = "true" ]; then args+=(--apply); fi
            # fail-fast:false parity — run every lane, remember any failure.
            node scripts/snapshot-impact-marketplace-prices.mjs "${args[@]}" | tee "$RUNNER_TEMP/impact-price-${PROVIDER}.json" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Require a healthy automated write
        if: github.event_name != 'workflow_dispatch'
        run: |
          node --input-type=module - "$RUNNER_TEMP" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const dir = process.argv[2];
          const files = fs.readdirSync(dir).filter((f) => f.startsWith("impact-price-") && f.endsWith(".json"));
          if (!files.length) throw new Error("No snapshot summaries were produced");
          for (const file of files) {
            const summary = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8"));
            if (summary.usable < 1 || summary.written < 1 || summary.failed > 0) {
              throw new Error(`Unhealthy ${summary.provider} snapshot: usable=${summary.usable}, written=${summary.written}, failed=${summary.failed}`);
            }
          }
          NODE

      # Bounded retention for the append-only history table. Scoped per
      # provider so it seeks the composite index, and only ever on scheduled
      # apply runs — a preview dispatch must not delete anything. Idempotent:
      # after the first pass there is normally nothing older than the window.
      - name: Prune history rows past the retention window
        if: github.event_name != 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          for PROVIDER in $PROVIDERS_TO_RUN; do
            node scripts/prune-provider-pricing-history.mjs --provider "$PROVIDER" --database "$DATABASE" --apply --json \
              | tee "$RUNNER_TEMP/history-prune-${PROVIDER}.json"
          done
          node --input-type=module - "$RUNNER_TEMP" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const dir = process.argv[2];
          const files = fs.readdirSync(dir).filter((f) => f.startsWith("history-prune-") && f.endsWith(".json"));
          if (!files.length) process.exit(0);
          const rows = files.map((file) => JSON.parse(fs.readFileSync(path.join(dir, file), "utf8")))
            .map((s) => `| ${s.provider} | ${s.retention_days} | ${s.prunable} | ${s.deleted} |`).join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## History retention\n\n| Provider | Days | Prunable | Deleted |\n| --- | ---: | ---: | ---: |\n${rows}\n`);
          NODE

      - name: Publish run summary
        if: always()
        run: |
          node --input-type=module - "$RUNNER_TEMP" <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const dir = process.argv[2];
          if (!fs.existsSync(dir)) process.exit(0);
          const files = fs.readdirSync(dir).filter((f) => f.startsWith("impact-price-") && f.endsWith(".json"));
          for (const file of files) {
            let s;
            try { s = JSON.parse(fs.readFileSync(path.join(dir, file), "utf8")); } catch { continue; }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## ${s.provider} price snapshots\n\n| Eligible | Fetched | Usable | Written | Failed |\n| ---: | ---: | ---: | ---: | ---: |\n| ${s.eligible} | ${s.fetched} | ${s.usable} | ${s.written} | ${s.failed} |\n\nZero-row reason: ${s.zero_row_reason || "—"}\n`);
          }
          NODE

      - name: Confirm source data and redirects were not changed
        if: always()
        run: |
          git diff --exit-code -- public/data/events.json
          git diff --exit-code -- functions/api/out.js
