name: Impact marketplace provider sync

# Nightly event-link enrichment for TicketNetwork, Ticket Liquidator, and
# StubHub International. The owner confirmed all three Impact catalog credential
# sets and tracking contracts on 2026-07-15. Scheduled runs apply only
# unambiguous exact-event matches, validate the exact diff, open one provider PR,
# and auto-merge only after every validation gate passes. Manual dispatch remains
# preview-first. No pricing data is required or written by this workflow.

on:
  schedule:
    # Run after Ticketmaster (04:00), SeatGeek (05:00), and Vivid Seats (05:30).
    # A shared concurrency group queues overruns rather than racing data files.
    - cron: '0 6 * * *'   # TicketNetwork
    - cron: '30 6 * * *'  # Ticket Liquidator
    - cron: '0 7 * * *'   # StubHub International
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to sync
        type: choice
        options: [ticketnetwork, ticket-liquidator, stubhub-international]
        required: true
      mode:
        description: Preview makes no changes; apply opens a review PR
        type: choice
        options: [preview, apply]
        default: preview
      artist:
        description: Optional artist slug (blank means every registry-verified artist)
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: impact-marketplace-provider-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMPACT_CATALOG_PROXY_URL: https://tourticketcompare.com/api/impact/products
      IMPACT_CATALOG_CREDENTIAL_SET: seatgeek
      IMPACT_CATALOG_API_VERSION: '16'
      IMPACT_TICKETNETWORK_ACCOUNT_SID: ${{ secrets.IMPACT_TICKETNETWORK_ACCOUNT_SID }}
      IMPACT_TICKETNETWORK_AUTH_TOKEN: ${{ secrets.IMPACT_TICKETNETWORK_AUTH_TOKEN }}
      IMPACT_TICKETNETWORK_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETNETWORK_CAMPAIGN_ID }}
      IMPACT_TICKETNETWORK_CATALOG_ID: ${{ secrets.IMPACT_TICKETNETWORK_CATALOG_ID }}
      IMPACT_TICKETNETWORK_PROGRAM_ID: ${{ secrets.IMPACT_TICKETNETWORK_PROGRAM_ID }}
      IMPACT_TICKETLIQUIDATOR_ACCOUNT_SID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_ACCOUNT_SID }}
      IMPACT_TICKETLIQUIDATOR_AUTH_TOKEN: ${{ secrets.IMPACT_TICKETLIQUIDATOR_AUTH_TOKEN }}
      IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID }}
      IMPACT_TICKETLIQUIDATOR_CATALOG_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_CATALOG_ID }}
      IMPACT_TICKETLIQUIDATOR_PROGRAM_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_PROGRAM_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_ACCOUNT_SID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_ACCOUNT_SID }}
      IMPACT_STUBHUB_INTERNATIONAL_AUTH_TOKEN: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_AUTH_TOKEN }}
      IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_CATALOG_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_CATALOG_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_PROGRAM_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_PROGRAM_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve scheduled or manual run configuration
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_PROVIDER: ${{ github.event.inputs.provider }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_ARTIST: ${{ github.event.inputs.artist }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '0 6 * * *') PROVIDER=ticketnetwork ;;
              '30 6 * * *') PROVIDER=ticket-liquidator ;;
              '0 7 * * *') PROVIDER=stubhub-international ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
            MODE=apply
            ARTIST=''
            AUTO_MERGE=true
          else
            PROVIDER="$INPUT_PROVIDER"
            MODE="${INPUT_MODE:-preview}"
            ARTIST="$INPUT_ARTIST"
            AUTO_MERGE=false
          fi
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "artist=$ARTIST" >> "$GITHUB_OUTPUT"
          echo "auto_merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"

      - name: Run offline ingestion contract tests
        run: npm run impact-providers:sync:self-test

      - name: Sync provider event links
        env:
          PROVIDER: ${{ steps.config.outputs.provider }}
          MODE: ${{ steps.config.outputs.mode }}
          ARTIST: ${{ steps.config.outputs.artist }}
        run: |
          set -euo pipefail
          args=(--provider "$PROVIDER" --max-api-calls 400 --delay-ms 1000)
          if [ -n "$ARTIST" ]; then args+=(--artist "$ARTIST"); fi
          if [ "$MODE" = "apply" ]; then
            node scripts/sync-impact-marketplace-events.mjs --apply "${args[@]}"
            npm run events:partition
            npm run events:sync
          else
            node scripts/sync-impact-marketplace-events.mjs "${args[@]}"
          fi

      - name: Validate proposed state
        run: |
          npm run events:validate:prod
          npm run events:validate:partitions
          npm run test:mvp
          git diff --check

      - name: Detect event changes
        id: diff
        run: |
          if git diff --quiet -- public/data/events.json public/data/events public/data/events-index.json public/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open validated provider PR
        if: steps.config.outputs.mode == 'apply' && steps.diff.outputs.changed == 'true'
        env:
          PROVIDER: ${{ steps.config.outputs.provider }}
          PR_AUTO_MERGE: ${{ steps.config.outputs.auto_merge }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "tourticketcompare-bot"
          git config user.email "tourticketcompare-bot@users.noreply.github.com"
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="automation/${PROVIDER}-impact-sync-${TODAY}"
          git checkout -B "$BRANCH"
          git add public/data/events.json public/data/events-index.json public/data/events public/index.html
          git commit -m "automation: ${PROVIDER} Impact catalog sync (${TODAY})"
          git push -u origin "$BRANCH" --force-with-lease
          BRANCH="$BRANCH" \
          PR_TITLE="${PROVIDER} Impact catalog sync (${TODAY})" \
          PR_LABEL="automation:provider-sync" \
          PR_AUTO_MERGE="$PR_AUTO_MERGE" \
          PR_BODY=
## What this PR does\n- Uses the owner-confirmed provider program in the Impact Catalogs API.\n- Adds or corrects only one unambiguous match whose artist, venue, city, and venue-local date agree.\n- Records provider-specific event ID, URL, verification date, and listing state.\n\n## Safety\n- No guessing, scraping, prices, or availability claims.\n- Incomplete catalogs never clear links.\n- Ambiguous matches stay unchanged.\n- Scheduled runs auto-merge only after the full in-job validation suite passes; manual apply runs remain review-only.\n' \
          node scripts/open-automation-pr.mjs
