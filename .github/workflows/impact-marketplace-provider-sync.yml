name: Impact marketplace provider sync

# Nightly event-link enrichment for TicketNetwork, Ticket Liquidator, and
# StubHub International. The owner confirmed all three Impact catalog credential
# sets and tracking contracts on 2026-07-15. Scheduled runs apply only
# unambiguous exact-event matches, validate the exact diff, open one provider PR,
# and auto-merge only after every validation gate passes. Manual dispatch remains
# preview-first. No pricing data is required or written by this workflow.

on:
  schedule:
    # Run after Ticketmaster (02:40), SeatGeek (18:00), and Vivid Seats (18:30).
    # The writer helper orders overruns without dropping a pending provider.
    - cron: '0 19 * * *'  # TicketNetwork
    - cron: '30 19 * * *' # Ticket Liquidator
    - cron: '0 20 * * *'  # StubHub International
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to sync
        type: choice
        options: [ticketnetwork, ticket-liquidator, stubhub-international]
        required: true
      mode:
        description: Preview makes no changes; apply opens a review PR
        type: choice
        options: [preview, apply]
        default: preview
      artist:
        description: Optional artist slug (blank means every registry-verified artist)
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Earning the `test-mvp` required status check on the PR head means
  # dispatching Prelaunch Validation against the pushed branch.
  actions: write

# All three provider runs remain eligible to start. A workflow concurrency
# group retains only one pending run and would evict the middle provider when
# the 19:00 run overruns 20:00. The writer-lane helper orders all three by run
# creation time before ingestion; queued runs are never dropped by a group.

jobs:
  sync:
    runs-on: ubuntu-latest
    # Reserve cumulative queue time for all three runs, even when their jobs
    # start together: 60/150/240 minutes waiting, then 90 minutes of work.
    # The preceding job's whole cap bounds the next run's wait; all stay
    # below GitHub's six-hour hosted-job maximum. Manual runs use the first cap.
    timeout-minutes: ${{ fromJSON('{"0 19 * * *":150,"30 19 * * *":240,"0 20 * * *":330}')[github.event.schedule] || 150 }}
    env:
      WRITER_WAIT_MINUTES: ${{ fromJSON('{"0 19 * * *":60,"30 19 * * *":150,"0 20 * * *":240}')[github.event.schedule] || 60 }}
      IMPACT_CATALOG_PROXY_URL: https://tourticketcompare.com/api/impact/products
      # /api/impact/products is token-gated; without this the proxy returns 404.
      IMPACT_CATALOG_PROXY_TOKEN: ${{ secrets.DEBUG_API_TOKEN }}
      IMPACT_CATALOG_CREDENTIAL_SET: seatgeek
      IMPACT_CATALOG_API_VERSION: '16'
      IMPACT_TICKETNETWORK_ACCOUNT_SID: ${{ secrets.IMPACT_TICKETNETWORK_ACCOUNT_SID }}
      IMPACT_TICKETNETWORK_AUTH_TOKEN: ${{ secrets.IMPACT_TICKETNETWORK_AUTH_TOKEN }}
      IMPACT_TICKETNETWORK_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETNETWORK_CAMPAIGN_ID }}
      IMPACT_TICKETNETWORK_CATALOG_ID: ${{ secrets.IMPACT_TICKETNETWORK_CATALOG_ID }}
      IMPACT_TICKETNETWORK_PROGRAM_ID: ${{ secrets.IMPACT_TICKETNETWORK_PROGRAM_ID }}
      IMPACT_TICKETLIQUIDATOR_ACCOUNT_SID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_ACCOUNT_SID }}
      IMPACT_TICKETLIQUIDATOR_AUTH_TOKEN: ${{ secrets.IMPACT_TICKETLIQUIDATOR_AUTH_TOKEN }}
      IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID }}
      IMPACT_TICKETLIQUIDATOR_CATALOG_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_CATALOG_ID }}
      IMPACT_TICKETLIQUIDATOR_PROGRAM_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_PROGRAM_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_ACCOUNT_SID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_ACCOUNT_SID }}
      IMPACT_STUBHUB_INTERNATIONAL_AUTH_TOKEN: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_AUTH_TOKEN }}
      IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_CATALOG_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_CATALOG_ID }}
      IMPACT_STUBHUB_INTERNATIONAL_PROGRAM_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_PROGRAM_ID }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for older event-data writer runs
        # Queues behind any older writer lane still in flight, then fast-forwards
        # to the branch tip, so this run branches from a main that already holds
        # their merges. See scripts/wait-for-writer-lanes.mjs.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-writer-lanes.mjs --max-wait-minutes "$WRITER_WAIT_MINUTES"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve scheduled or manual run configuration
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_PROVIDER: ${{ github.event.inputs.provider }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_ARTIST: ${{ github.event.inputs.artist }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '0 19 * * *') PROVIDER=ticketnetwork ;;
              '30 19 * * *') PROVIDER=ticket-liquidator ;;
              '0 20 * * *') PROVIDER=stubhub-international ;;
              *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
            MODE=apply
            ARTIST=''
            AUTO_MERGE=true
          else
            PROVIDER="$INPUT_PROVIDER"
            MODE="${INPUT_MODE:-preview}"
            ARTIST="$INPUT_ARTIST"
            AUTO_MERGE=false
          fi
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "artist=$ARTIST" >> "$GITHUB_OUTPUT"
          echo "auto_merge=$AUTO_MERGE" >> "$GITHUB_OUTPUT"

      - name: Run offline ingestion contract tests
        run: npm run impact-providers:sync:self-test

      # Artists whose top-earning shows lack this lane (the daily show-priority
      # list, scripts/report-show-priority.mjs) are checked before the rotation.
      # Read-only and fail-open: no list means the plain rotation.
      - name: Read show-priority coverage gaps
        id: priority
        if: steps.config.outputs.artist == ''
        continue-on-error: true
        env:
          PROVIDER: ${{ steps.config.outputs.provider }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          artists=$(node scripts/report-show-priority.mjs --gap-artists "$PROVIDER" | paste -sd, -)
          echo "artists=${artists}" >> "$GITHUB_OUTPUT"
          echo "Show-priority artists first: ${artists:-none}"

      - name: Sync provider event links
        env:
          PROVIDER: ${{ steps.config.outputs.provider }}
          MODE: ${{ steps.config.outputs.mode }}
          ARTIST: ${{ steps.config.outputs.artist }}
          PRIORITY_ARTISTS: ${{ steps.priority.outputs.artists }}
        run: |
          set -euo pipefail
          # The runtime limit reserves time for validation after ordering;
          # the artist order rotates daily, so a run cut short
          # by it does not leave the same artists unchecked every night.
          args=(--provider "$PROVIDER" --max-api-calls 1200 --max-runtime-minutes 35 --delay-ms 1000)
          if [ -n "$ARTIST" ]; then args+=(--artist "$ARTIST"); fi
          if [ -n "${PRIORITY_ARTISTS:-}" ]; then args+=(--priority-artists "$PRIORITY_ARTISTS"); fi
          if [ "$MODE" = "apply" ]; then
            node scripts/sync-impact-marketplace-events.mjs --apply "${args[@]}"
            npm run events:partition
            node scripts/validate-status-counts.mjs --write
            # Card every page this run's data made indexable (scripts/build-og-cards.mjs).
            if ! git diff --quiet -- public/data; then npm run og:build; fi
          else
            node scripts/sync-impact-marketplace-events.mjs "${args[@]}"
          fi

      - name: Validate proposed state
        run: |
          npm run events:validate:prod
          npm run events:validate:partitions
          npm run test:mvp
          git diff --check

      - name: Detect event changes
        id: diff
        env:
          PROVIDER: ${{ steps.config.outputs.provider }}
        run: |
          if git diff --quiet -- public/data/events.json public/data/events public/data/events-index.json public/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # The audit log is coverage evidence even on a night that changes no
          # links, so it publishes when its outcome rows differ from the
          # committed log. Timestamps and run counters alone never open a PR.
          LOG="reports/provider-sync/${PROVIDER}-event-sync.md"
          outcome_rows() { grep '^| ' || true; }
          if [ ! -f "$LOG" ]; then
            echo "log_changed=false" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "HEAD:$LOG" 2>/dev/null; then
            echo "log_changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$(git show "HEAD:$LOG" | outcome_rows)" != "$(outcome_rows < "$LOG")" ]; then
            echo "log_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "log_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare publishing identity
        id: publishing-identity
        if: steps.config.outputs.mode == 'apply' && (steps.diff.outputs.changed == 'true' || steps.diff.outputs.log_changed == 'true')
        uses: ./.github/actions/automation-identity
        with:
          enabled: ${{ vars.AUTOMATION_APP_ENABLED }}
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open validated provider PR
        timeout-minutes: 30
        if: steps.config.outputs.mode == 'apply' && (steps.diff.outputs.changed == 'true' || steps.diff.outputs.log_changed == 'true')
        env:
          PROVIDER: ${{ steps.config.outputs.provider }}
          PR_AUTO_MERGE: ${{ steps.config.outputs.auto_merge }}
          GITHUB_TOKEN: ${{ steps.publishing-identity.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "tourticketcompare-bot"
          git config user.email "tourticketcompare-bot@users.noreply.github.com"
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="automation/${PROVIDER}-impact-sync-${TODAY}"
          git checkout -B "$BRANCH"
          git add public/data/events.json public/data/events-index.json public/data/events public/index.html PROJECT_STATUS.md public/og functions/_og-cards.generated.js "reports/provider-sync/${PROVIDER}-event-sync.md"
          git commit -m "automation: ${PROVIDER} Impact catalog sync (${TODAY})"
          node scripts/push-automation-branch.mjs "$BRANCH" --force-with-lease
          BRANCH="$BRANCH" \
          PR_TITLE="${PROVIDER} Impact catalog sync (${TODAY})" \
          PR_LABEL="automation:provider-sync" \
          PR_AUTO_MERGE="$PR_AUTO_MERGE" \
          PR_BODY="Adds or corrects only unambiguous exact-event links from the owner-confirmed Impact catalog. No guessing, scraping, prices, or availability claims. Incomplete catalogs preserve existing links. A run that changes no links publishes only its refreshed per-event audit log (reports/provider-sync), when its outcomes changed. Scheduled auto-merge occurs only after the full in-job validation suite passes; manual apply runs remain review-only." \
          node scripts/open-automation-pr.mjs
