name: IndexNow ping

# Notifies Bing/Yandex-class engines (which also feed ChatGPT search and
# Copilot) that the site's URLs are ready to crawl, instead of waiting for a
# scheduled sitemap recrawl.
#
# Fires on pushes to main that change the indexable URL set — which includes the
# auto-merged provider/discovery sync lanes, so newly verified shows are
# announced the same night they land. The job snapshots production's sitemap,
# waits for the Cloudflare Pages deploy of this commit to land, then submits
# only the URLs that actually changed. If the delta cannot be isolated it falls
# back to the full live list, which is always valid.
#
# Read-only with respect to the repo and D1: it publishes nothing, changes no
# data, and submits only URLs the live sitemap already advertises.

on:
  push:
    branches:
      - main
    paths:
      # Data that drives artist / city / venue / artist-city indexability.
      - 'public/data/events.json'
      - 'public/data/events/**'
      - 'public/data/artists.json'
      - 'public/data/catalog.json'
      # Compiled blog content — a new or revised post changes the indexable URL
      # set exactly like a new event does. content/blog/*.md is deliberately not
      # listed: it is the source, and content-build.yml commits the compiled
      # file, which is the push that should trigger this.
      - 'public/data/blog-content.json'
      # Code that decides which routes are indexable at all.
      - 'functions/sitemap.xml.js'
      - 'functions/_blog.js'
      - 'functions/_route-metadata.js'
      - 'functions/_cities.js'
      - 'functions/_venues.js'
      - 'functions/_artist-cities.js'
      - 'functions/_artist-indexability.js'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only. Leave true to list URLs without submitting.'
        type: boolean
        default: true
      await_deploy:
        description: 'Wait for production to serve this commit before submitting.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Only the newest sitemap matters — each ping submits the full URL list.
  group: indexnow-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: the ping and its self-test import only Node built-ins and
      # local functions/ modules, so installing 91 packages would add runtime
      # and a failure mode for nothing.

      - name: Run IndexNow self-test
        run: npm run indexnow:ping:self-test

      - name: Submit sitemap URLs to IndexNow
        run: |
          set -euo pipefail
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then args+=(--dry-run); fi
            if [ "${{ github.event.inputs.await_deploy }}" != "false" ]; then args+=(--await-deploy); fi
          else
            args+=(--await-deploy)
          fi
          node scripts/indexnow-ping.mjs "${args[@]}" | tee "$RUNNER_TEMP/indexnow.log"

      - name: Publish run summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## IndexNow ping"
            echo
            if [ -f "$RUNNER_TEMP/indexnow.log" ]; then
              echo '```'
              grep -v '^https://' "$RUNNER_TEMP/indexnow.log" || true
              echo '```'
            else
              echo "No run output — the job failed before submitting."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm no repo changes
        if: always()
        run: git diff --exit-code
