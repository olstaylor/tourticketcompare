name: Nightly data sync

# Authoritative nightly field-sync for already-tracked events.
#
# Auto-commits lossless date/time + venue/city changes pulled from the
# Ticketmaster Discovery API for events that already exist in events.json, then
# regenerates the partitions and publishes to main through an auto-merged PR
# whose head has passed the required validation check (Cloudflare Pages
# auto-deploys on merge). Anything that needs human judgement — brand-new shows,
# deletions, cancellations, tour names — is NOT auto-published; it is surfaced
# in the rolling "automation:data-sync" issue / handled by the discovery PR flow.
#
# The cron runs 30 min after daily-audit.yml (03:00 UTC) to avoid Ticketmaster
# rate-limit collisions.

on:
  # Cron re-enabled 2026-07-07 (owner-approved) after the guard conditions were
  # met: the CTA ↔ provider-state regression guard (validate-cta-provider-state,
  # in test:mvp) landed and gates the commit below, and a clean manual dry-run
  # was reviewed (0 errors; updates only computed for events with zero review
  # blockers). Scheduled runs are NOT dry runs: lossless factual updates to
  # already-tracked events auto-commit to main per SAFE_PUBLISHING_RULES.md.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and report only; do not write, commit, or push.'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Earning the `test-mvp` required status check means dispatching Prelaunch
  # Validation against the pushed branch.
  actions: write

concurrency:
  group: nightly-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Room for the dispatched Prelaunch Validation run the publish step waits on.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p .audit

      - name: Apply authoritative TM field updates
        id: apply
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          node scripts/apply-tm-updates.mjs $DRY --json .audit/tm-sync.json

      - name: Detect data changes
        id: diff
        run: |
          if git diff --quiet -- public/data/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate sync report commit gate
        id: gate
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const reportPath = '.audit/tm-sync.json';
          if (!fs.existsSync(reportPath)) {
            console.log('updated=0');
            console.log('review_items=0');
            console.log('errors=1');
            console.log('blocked_updates=0');
            console.log('commit_allowed=false');
            throw new Error(`${reportPath} was not written; refusing to commit`);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const updated = Number(report?.summary?.updated ?? report?.updates?.length ?? 0);
          const reviewItems = Number(report?.summary?.reviewItems ?? report?.reviewItems?.length ?? 0);
          const errors = Number(report?.summary?.errors ?? report?.errors?.length ?? 0);
          const blockedUpdates = Number(report?.summary?.blockedUpdateIds ?? report?.blockedUpdateIds?.length ?? 0);
          // The sync script only applies updates to events with ZERO review
          // blockers of their own (blocked events are skipped and listed in
          // blockedUpdateIds). Standing review-only items on other events —
          // e.g. permanently-offsale rows — are surfaced in the rolling issue
          // but must not veto the clean events' lossless updates, otherwise
          // the nightly sync can never commit. Errors still veto everything.
          const commitAllowed = updated > 0 && errors === 0;
          console.log(`updated=${updated}`);
          console.log(`review_items=${reviewItems}`);
          console.log(`errors=${errors}`);
          console.log(`blocked_updates=${blockedUpdates}`);
          console.log(`commit_allowed=${commitAllowed ? 'true' : 'false'}`);
          console.error(`TM sync gate: updated=${updated}, reviewItems=${reviewItems}, errors=${errors}, blockedUpdates=${blockedUpdates}, commitAllowed=${commitAllowed}`);
          NODE

      # Validation and smoke tests gate the commit: if any check fails, nothing
      # is committed or pushed. Any error keeps commit_allowed=false; review
      # items and blocked updates never reach the diff (the script skips those
      # events) and are surfaced by the review issue/artifact steps below.
      - name: Validate events (production rules)
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.commit_allowed == 'true'
        run: npm run events:validate:prod

      - name: Regenerate partitions
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.commit_allowed == 'true'
        run: |
          npm run events:partition
          npm run events:validate:partitions
          # Self-heal PROJECT_STATUS.md counts so this direct-to-main commit
          # never drifts the status doc (warning-first check can't block auto-merge).
          node scripts/validate-status-counts.mjs --write

      - name: Run smoke tests before push
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.commit_allowed == 'true'
        run: npm run test:mvp

      # Published as an auto-merged PR, not a direct push: since 2026-09-11 `main`
      # requires the `test-mvp` status check on the commit being published, and a
      # commit built on this runner carries none. The helper dispatches the real
      # validation workflow against the pushed branch, waits for its verdict, and
      # merges only on green — the in-job suite above stays the pre-push gate.
      - name: Publish through a validated, auto-merged PR
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.commit_allowed == 'true' && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="automation/nightly-data-sync-${TODAY}"
          git config user.name "tourticketcompare-bot"
          git config user.email "tourticketcompare-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public/data/events.json public/data/events public/index.html PROJECT_STATUS.md
          git commit -m "Nightly data sync: refresh tracked event dates/venues (${TODAY})"
          git push -u origin "$BRANCH" --force-with-lease
          BRANCH="$BRANCH" \
          PR_TITLE="Nightly data sync: refresh tracked event dates/venues (${TODAY})" \
          PR_LABEL="automation:data-sync" \
          PR_AUTO_MERGE=true \
          PR_BODY=$'## What this PR does\n- Applies lossless date/time and venue/city corrections from the Ticketmaster Discovery API to events that are already tracked in `public/data/events.json`, then regenerates the partitions and the homepage fallback.\n- Only events with zero review blockers of their own are updated; blocked and review-only rows are surfaced in the rolling `automation:data-sync` issue and left untouched here.\n\n## Explicit non-changes\n- No new shows, deletions, cancellations or `tour_name` edits — those stay human-gated.\n- No provider, price, redirect or affiliate logic.\n\n## Validation\n- `events:validate:prod`, `events:validate:partitions` and `npm run test:mvp` passed in-job on exactly this content, and Prelaunch Validation runs again on this branch before the merge.\n' \
          node scripts/open-automation-pr.mjs

      - name: Post review issue (review-only blockers)
        if: always() && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/report-tm-sync-review.mjs --report .audit/tm-sync.json --repo "${GITHUB_REPOSITORY}"

      - name: Upload sync artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-data-sync-${{ github.run_id }}
          path: .audit/tm-sync.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
