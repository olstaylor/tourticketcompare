name: Plan scoreboard

# Weekly scoreboard for the owner's revenue plan (scripts/report-plan-scoreboard.mjs):
# search visits and page-backed ticket clicks per Monday-Sunday week from
# DEMAND_DB, set beside the plan's checkpoints and January targets. Rewrites the
# rolling `automation:plan-scoreboard` issue.
#
# Read-only on D1 (SELECTs only) and on the repository; its only write is that
# one issue. Also reads Impact actions (read-only) and failed workflow runs
# (actions: read). Monday 07:20 UTC, after the week it reports has closed.

on:
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: plan-scoreboard
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Self-test
        run: node scripts/report-plan-scoreboard.mjs --self-test

      - name: Report and update the scoreboard issue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID || secrets.IMPACT_VIVIDSEATS_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN || secrets.IMPACT_VIVIDSEATS_AUTH_TOKEN }}
          IMPACT_SEATGEEK_CAMPAIGN_ID: ${{ secrets.IMPACT_SEATGEEK_CAMPAIGN_ID }}
          IMPACT_SEATGEEK_PROGRAM_ID: ${{ secrets.IMPACT_SEATGEEK_PROGRAM_ID }}
          IMPACT_VIVIDSEATS_CAMPAIGN_ID: ${{ secrets.IMPACT_VIVIDSEATS_CAMPAIGN_ID }}
          IMPACT_VIVIDSEATS_PROGRAM_ID: ${{ secrets.IMPACT_VIVIDSEATS_PROGRAM_ID }}
          IMPACT_TICKETNETWORK_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETNETWORK_CAMPAIGN_ID }}
          IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID: ${{ secrets.IMPACT_TICKETLIQUIDATOR_CAMPAIGN_ID }}
          IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID: ${{ secrets.IMPACT_STUBHUB_INTERNATIONAL_CAMPAIGN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/report-plan-scoreboard.mjs --issue --markdown "$RUNNER_TEMP/scoreboard.md"

      - name: Summarise
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/scoreboard.md" ]; then
            cat "$RUNNER_TEMP/scoreboard.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The scoreboard produced nothing; treat this week as unknown." >> "$GITHUB_STEP_SUMMARY"
          fi
