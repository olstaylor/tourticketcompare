name: PR validation head guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  workflow_run:
    workflows: ["Prelaunch Validation"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# One repository-wide scan at a time, but never cancel the one that is running:
# the guard's whole output is a single rolling issue, and a cancelled scan writes
# nothing. A burst of PR activity queues behind the active run instead of
# starving it, which a fork author could otherwise do by pushing repeatedly.
concurrency:
  group: pr-validation-head-guard
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test
        run: node scripts/check-pr-validation-heads.mjs --self-test
      - name: Check exact PR head validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_VALIDATION_AGE_MINUTES: "30"
        run: node scripts/check-pr-validation-heads.mjs
