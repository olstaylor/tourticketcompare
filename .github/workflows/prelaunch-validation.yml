name: Prelaunch Validation

on:
  pull_request:
  # Manual escape hatch. On 2026-08-03/04 a PR's later pushes produced no
  # `synchronize` run at all, leaving the branch validated only at the commit
  # the PR was opened on — with no way to re-run against the real head. Note
  # GitHub only offers workflow_dispatch for workflows present on the default
  # branch, so this becomes usable once merged, for every branch after it.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA to validate (defaults to the selected ref)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-mvp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty on pull_request, so checkout keeps its default behaviour and
          # PR runs are unchanged.
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production event data
        run: python3 scripts/validate-events.py --for-production

      - name: Validate guide route / content / sitemap sync
        run: npm run guides:validate

      - name: Validate rendered head + JSON-LD schema contract
        run: npm run schema:validate

      - name: Run canonical prelaunch validation
        run: npm run test:mvp

      # Fails only on structural change — routes that still render changing
      # indexability — and annotates (never fails) a large total swing caused by
      # ordinary event expiry. See docs/ROUTE_INDEXABILITY_POLICY.md § Monitoring.
      - name: Audit the indexable surface against its baseline
        run: npm run audit:indexable-surface:check

      - name: Check JavaScript syntax
        run: node --check public/app.js 'functions/[[path]].js' functions/api/out.js

      - name: Check patch whitespace
        run: git diff --check

  stale-sync-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a manual run there is no base/head pair to diff, so check
      # unconditionally — it is cheap, and staleness is the real invariant.
      - name: Detect data changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- public/data | grep -q .; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure index.html reflects current data
        if: steps.changed.outputs.data_changed == 'true'
        run: |
          python3 scripts/sync-events-data.py
          if ! git diff --quiet -- public/index.html; then
            echo "::error::public/data/*.json was modified but public/index.html is stale."
            echo "Run 'npm run events:sync' locally and commit the index.html diff."
            git --no-pager diff -- public/index.html | head -80
            exit 1
          fi
