name: SeatGeek CTA sync

# Nightly SeatGeek CTA enrichment + verification loop (owner-approved
# 2026-07-07 — the third sanctioned auto-publish path in
# SAFE_PUBLISHING_RULES.md). Keeps SeatGeek event CTAs current with no
# owner input:
#
#   1. scripts/enrich-seatgeek-events.mjs --apply-high-confidence — adds
#      event-level seatgeek_url values for Ticketmaster-verified events that
#      are missing one (high-confidence matches only, logged). This is what
#      gives newly-discovered shows their SeatGeek CTA automatically.
#   2. scripts/verify-seatgeek-events.mjs --apply — identity-anchored
#      verification against the registry seatgeek_performer_id: writes
#      provider_links.seatgeek verified provenance (which lets the SeatGeek
#      CTA publish standalone on needs_recheck events whose Ticketmaster
#      storefront URL is broken), discovers URLs for suppressed events,
#      corrects wrong-night URLs, and un-verifies/clears listings the
#      SeatGeek API no longer confirms. Zero/ambiguous matches are reported,
#      never guessed.
#
# The full validation suite runs in-job on exactly the proposed content
# before the PR opens; scheduled runs then auto-merge (squash) via
# PR_AUTO_MERGE. A failed merge leaves the PR open for a human — never
# forced. Manual dispatch defaults to a safe preview (no writes, no PR).
#
# Ticketmaster links, verification_status, tour_name, out.js, and affiliate
# logic are never touched by this loop. Without SEATGEEK_CLIENT_ID the run
# no-ops safely.
#
# See docs/SEATGEEK_DISCOVERY.md and SAFE_PUBLISHING_RULES.md.

on:
  schedule:
    # 05:00 UTC — after the 04:00 tm-new-shows-pr run has merged its new
    # shows, so they are enriched with SeatGeek URLs the same morning.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = dry-run only (no writes, no PR). apply = write + open review PR.'
        type: choice
        options:
          - preview
          - apply
        default: preview
      auto_merge:
        description: 'With apply: squash-merge the PR once the in-run validation suite has passed (scheduled runs always do this).'
        type: boolean
        default: false
      artist:
        description: 'Single artist slug for the verify step (blank = all).'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: seatgeek-cta-sync
  cancel-in-progress: false

jobs:
  seatgeek-cta-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "tourticketcompare-bot"
          git config user.email "tourticketcompare-bot@users.noreply.github.com"

      - name: Enrich + verify SeatGeek event links
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_ARTIST: ${{ github.event.inputs.artist }}
        run: |
          set -euo pipefail
          if [ -z "${SEATGEEK_CLIENT_ID:-}" ]; then
            echo "SEATGEEK_CLIENT_ID not configured — safe no-op (no checks, no writes, no PR)."
            exit 0
          fi
          VERIFY_ARGS=(--max-api-calls 400 --delay-ms 1000)
          if [ -n "${INPUT_ARTIST:-}" ]; then
            VERIFY_ARGS+=(--artist "${INPUT_ARTIST}")
          fi
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${INPUT_MODE:-preview}" = "apply" ]; then
            # Enrichment first (adds missing URLs to TM-verified events), then
            # verification (provenance, suppressed-event discovery, self-heal).
            node scripts/enrich-seatgeek-events.mjs --apply-high-confidence --max-api-calls 150 --delay-ms 1000
            node scripts/verify-seatgeek-events.mjs --apply "${VERIFY_ARGS[@]}"
            npm run events:partition
            npm run events:sync
          else
            echo "PREVIEW — dry-run only, no writes."
            node scripts/enrich-seatgeek-events.mjs --max-api-calls 150 --delay-ms 1000
            node scripts/verify-seatgeek-events.mjs "${VERIFY_ARGS[@]}"
          fi

      - name: Validate
        run: |
          npm run events:validate:prod
          npm run events:validate:partitions
          npm run test:mvp
          git diff --check

      - name: Detect data changes
        id: diff
        run: |
          if git diff --quiet -- public/data/events.json public/data/events public/data/events-index.json public/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open SeatGeek CTA sync PR
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'apply')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AUTO_MERGE: ${{ github.event.inputs.auto_merge }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="automation/seatgeek-cta-sync-${TODAY}"
          git checkout -B "$BRANCH"
          git add public/data/events.json public/data/events-index.json public/data/events public/index.html reports/provider-sync/seatgeek-cta-auto-add.md reports/provider-sync/seatgeek-cta-verify.md
          git commit -m "automation: SeatGeek CTA enrichment + verification (${TODAY})"
          git push -u origin "$BRANCH" --force-with-lease
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${INPUT_AUTO_MERGE:-false}" = "true" ]; then
            AUTO_MERGE=true
          else
            AUTO_MERGE=false
          fi
          BRANCH="$BRANCH" \
          PR_TITLE="SeatGeek CTA sync (${TODAY})" \
          PR_LABEL="automation:seatgeek-cta" \
          PR_AUTO_MERGE="$AUTO_MERGE" \
          PR_BODY=$'## What this PR does\n- Adds high-confidence event-level `seatgeek_url` values to Ticketmaster-verified events that were missing one (`scripts/enrich-seatgeek-events.mjs`, audit log `reports/provider-sync/seatgeek-cta-auto-add.md`).\n- Verifies stored SeatGeek links against the SeatGeek API record for the registry-verified performer id, and writes `provider_links.seatgeek` verified provenance (`scripts/verify-seatgeek-events.mjs`, audit log `reports/provider-sync/seatgeek-cta-verify.md`). Verified provenance lets the SeatGeek CTA publish standalone on `needs_recheck` events — the recheck flag tracks the broken Ticketmaster storefront URL, not the SeatGeek listing.\n- Self-heals in the safe direction: wrong-night or no-longer-confirmed URLs are corrected or cleared, never guessed. Ambiguous matches are reported and left untouched.\n\n## Explicit non-changes\n- No `verification_status`, `ticketmaster_*`, or `tour_name` changes; no CTA restoration of Ticketmaster links.\n- No changes to `functions/api/out.js`, `VERIFIED_TICKET_LINKS`, or affiliate logic. No prices.\n\n## Validation run before this PR\n- `events:validate:prod`, `events:validate:partitions`, `test:mvp` (includes the CTA ↔ provider-state guard), `git diff --check`.\n\n## Review checklist (post-merge spot check on auto-merged runs)\n- [ ] Spot-check a verified event: the SeatGeek page matches artist, venue, and local date.\n- [ ] Check the two audit logs for corrected/cleared/conflict rows.\n' \
          node scripts/open-automation-pr.mjs
