name: SeatGeek price snapshots

# SeatGeek price snapshot ingestion for D1 provider_pricing_cache.
# Required repository secrets:
# - SEATGEEK_CLIENT_ID
# - SEATGEEK_CLIENT_SECRET
# - CLOUDFLARE_API_TOKEN (apply mode only; remote D1 writes via wrangler)
# - CLOUDFLARE_ACCOUNT_ID (apply mode only; remote D1 writes via wrangler)
# D1 target:
# - Default database name is tourticketcompare-demand, matching wrangler.toml and
#   scripts/snapshot-seatgeek-prices.mjs. Override only for a known safe D1 target.
# Safety notes:
# - The workflow never enables SEATGEEK_PRICE_DISPLAY_ENABLED.
# - It does not deploy, call /api/out, mutate event data, or run destructive D1 SQL.

on:
  # Scheduled runs are DISABLED (2026-07-15, owner-directed). SeatGeek does not
  # expose event pricing statistics via the API for this client — every
  # eligible event returns HTTP 200 with null lowest/average/highest price, so
  # no usable snapshot can ever be built and the four-hourly job only produced
  # zero-row runs. This is a permanent provider-API limitation, not a pending
  # entitlement, so the cron is removed rather than left running red. Manual
  # workflow_dispatch is retained purely as a reversible escape hatch if
  # SeatGeek ever ships pricing-stat access; re-enable the schedule then.
  # schedule:
  #   - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write snapshots to remote D1. Leave false for self-test + dry-run only.'
        type: boolean
        default: false
      limit:
        description: 'Optional max eligible SeatGeek events to process.'
        type: string
        default: ''
      event_id:
        description: 'Optional single local event ID to process.'
        type: string
        default: ''
      database:
        description: 'D1 database name for apply mode.'
        type: string
        default: 'tourticketcompare-demand'

permissions:
  contents: read

concurrency:
  group: seatgeek-price-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEATGEEK_PRICE_DISPLAY_ENABLED: 'false'
      D1_DATABASE_NAME: ${{ github.event.inputs.database || 'tourticketcompare-demand' }}
      SNAPSHOT_LIMIT: ${{ github.event.inputs.limit || '' }}
      SNAPSHOT_EVENT_ID: ${{ github.event.inputs.event_id || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SeatGeek price snapshot self-test
        run: npm run seatgeek:prices:self-test

      - name: Require SeatGeek credentials for API snapshot runs
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SEATGEEK_CLIENT_ID}" ]; then
            echo "::error::SEATGEEK_CLIENT_ID is required for SeatGeek price snapshot dry-run/apply."
            missing=1
          fi
          if [ -z "${SEATGEEK_CLIENT_SECRET}" ]; then
            echo "::error::SEATGEEK_CLIENT_SECRET is required for dependable SeatGeek pricing-stat access."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            {
              echo "## SeatGeek price snapshots"
              echo
              echo "Configuration incomplete. No provider requests or D1 writes were attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Manual non-apply dispatch only: apply runs skip this step entirely so the
      # SeatGeek API is not hit twice per run (a full dry-run immediately before
      # a full apply rate-limited the apply pass with HTTP 429).
      - name: Run SeatGeek price snapshot dry-run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply != 'true'
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          args=(--rematch-proposals reports/seatgeek-price-rematch-proposals.json)
          if [ -n "${SNAPSHOT_LIMIT}" ]; then
            args+=(--limit "${SNAPSHOT_LIMIT}")
          fi
          if [ -n "${SNAPSHOT_EVENT_ID}" ]; then
            args+=(--event-id "${SNAPSHOT_EVENT_ID}")
          fi
          node scripts/snapshot-seatgeek-prices.mjs --json "${args[@]}" | tee "$RUNNER_TEMP/seatgeek-price-summary.json"

      - name: Run SeatGeek price snapshot apply
        if: github.event_name == 'schedule' || github.event.inputs.apply == 'true'
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SEATGEEK_CLIENT_SECRET: ${{ secrets.SEATGEEK_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SEATGEEK_CLIENT_ID}" ]; then
            echo "::error::SEATGEEK_CLIENT_ID is required for apply mode."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required for remote D1 apply mode."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is required for remote D1 apply mode."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          args=(--database "${D1_DATABASE_NAME}" --rematch-proposals reports/seatgeek-price-rematch-proposals.json)
          if [ -n "${SNAPSHOT_LIMIT}" ]; then
            args+=(--limit "${SNAPSHOT_LIMIT}")
          fi
          if [ -n "${SNAPSHOT_EVENT_ID}" ]; then
            args+=(--event-id "${SNAPSHOT_EVENT_ID}")
          fi
          node scripts/snapshot-seatgeek-prices.mjs --apply --json "${args[@]}" | tee "$RUNNER_TEMP/seatgeek-price-summary.json"

      - name: Publish SeatGeek snapshot run summary
        if: always()
        run: |
          node --input-type=module - "$RUNNER_TEMP/seatgeek-price-summary.json" <<'NODE'
          import fs from "node:fs";
          const file = process.argv[2];
          if (!fs.existsSync(file)) process.exit(0);
          const summary = JSON.parse(fs.readFileSync(file, "utf8"));
          const metrics = ["eligible", "fetched", "usable", "written", "skipped", "stale", "failed"];
          const rows = metrics.map((key) => `| ${key} | ${summary[key] ?? 0} |`).join("\n");
          const reason = summary.zero_row_reason || "—";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## SeatGeek price snapshots\n\n| Metric | Count |\n| --- | ---: |\n${rows}\n\n**Zero-row reason:** ${reason}\n`);
          if (summary.failed > 0) console.log(`::warning::${summary.failed} SeatGeek observations failed.`);
          if (summary.zero_row_reason === "pricing_stats_unavailable") console.log("::warning::SeatGeek pricing-stats entitlement unavailable — 0 usable rows. Known owner-tracked blocker (see PROJECT_STATUS.md); job is not failed but requires SeatGeek partner support to resolve.");
          else if (summary.zero_row_reason) console.log(`::notice::SeatGeek zero-row reason: ${summary.zero_row_reason}`);
          NODE

      - name: Audit SeatGeek cache freshness
        if: always() && (github.event_name == 'schedule' || github.event.inputs.apply == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE_NAME}" --remote --json --command "SELECT COUNT(*) AS total, SUM(CASE WHEN datetime(expires_at) > datetime('now') THEN 1 ELSE 0 END) AS fresh, SUM(CASE WHEN datetime(expires_at) <= datetime('now') THEN 1 ELSE 0 END) AS stale FROM provider_pricing_cache WHERE provider = 'seatgeek' AND source = 'seatgeek_partner_api';" > "$RUNNER_TEMP/seatgeek-cache-audit.json"
          node --input-type=module - "$RUNNER_TEMP/seatgeek-cache-audit.json" <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const root = Array.isArray(payload) ? payload[0] : payload;
          const row = root?.results?.[0] || {};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### D1 cache after run\n\n| Fresh | Stale | Total |\n| ---: | ---: | ---: |\n| ${row.fresh ?? 0} | ${row.stale ?? 0} | ${row.total ?? 0} |\n`);
          NODE

      # Proposal-only re-match report for stale SeatGeek event ids (HTTP 404 on
      # eligible events). Reviewed and applied through the SeatGeek CTA
      # verification lane; nothing here mutates event data.
      - name: Upload SeatGeek re-match proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seatgeek-price-rematch-proposals
          path: reports/seatgeek-price-rematch-proposals.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Confirm protected files/data were not modified
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- functions/api/out.js
          git diff --exit-code -- public/data/events.json
