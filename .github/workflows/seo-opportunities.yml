name: SEO opportunities

# Weekly read-only SEO opportunity report (scripts/report-seo-opportunities.mjs,
# scoring in scripts/lib/seo-opportunities.mjs, Search Console client in
# scripts/lib/search-console-api.mjs). Pulls the last 28 complete days of
# Search Console page and query rows with a read-only service account, reads
# landing conversion and `show_priority` from D1 (SELECTs only) and rewrites the
# rolling `automation:seo-opportunities` issue.
#
# It writes nothing to the repository or D1, so it takes no writer lock. Until
# the owner adds the GSC_SERVICE_ACCOUNT_JSON secret (setup in
# docs/COMMERCIAL_FUNNEL.md) the run step is skipped with a notice and the job
# stays green. Monday 06:30 UTC.

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-opportunities
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Self-test
        run: node scripts/report-seo-opportunities.mjs --self-test

      - name: Check for the Search Console key
        id: key
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::GSC_SERVICE_ACCOUNT_JSON is not set, so the SEO opportunity report was skipped. The owner needs to add it (setup steps in docs/COMMERCIAL_FUNNEL.md, 'SEO opportunity report')."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report and update the issue
        if: steps.key.outputs.present == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/report-seo-opportunities.mjs --gsc-api --remote --issue --markdown "$RUNNER_TEMP/seo-opportunities.md" --json "$RUNNER_TEMP/seo-opportunities.json"

      - name: Keep the full list
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seo-opportunities
          path: ${{ runner.temp }}/seo-opportunities.json
          if-no-files-found: ignore
          retention-days: 28

      - name: Summarise
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/seo-opportunities.md" ]; then
            cat "$RUNNER_TEMP/seo-opportunities.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced (see the notice or the failed step above)." >> "$GITHUB_STEP_SUMMARY"
          fi
