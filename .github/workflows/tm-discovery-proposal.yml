name: Ticketmaster Discovery Proposal

on:
  workflow_dispatch:

jobs:
  proposal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate proposal artifacts
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TM_OUTPUT_DIR: artifacts/tm-discovery
          TM_DISCOVERY_PAGE_LIMIT: '3'
          TM_DISCOVERY_PAGE_SIZE: '50'
        run: node scripts/tm-discovery-proposal.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tm-discovery-proposal
          path: artifacts/tm-discovery/
          if-no-files-found: error
