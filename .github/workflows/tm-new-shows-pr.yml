name: Ticketmaster new shows PR

# Scheduled new-show discovery loop (provider-sync step 3, write-to-PR mode).
#
# Each day this runs the Ticketmaster Discovery recogniser for every verified,
# sync-enabled artist in data/provider-identities.json, opens ONE PR proposing
# newly-discovered shows, and (scheduled runs) auto-merges it once the in-run
# validation suite has passed (owner-approved 2026-07-07 — the narrow
# auto-publish exception in SAFE_PUBLISHING_RULES.md):
#
#   - scripts/sync-tm-events-write-pr.mjs never commits to main directly; the
#     full validation suite (apply-artists validate-with-rollback, test:mvp)
#     runs in-job on exactly the proposed content before the PR opens, and a
#     failed auto-merge leaves the PR open for a human instead of forcing it.
#   - The recogniser withholds events already in events.json, so only genuinely
#     new shows are proposed; a quiet day produces no commit and no PR.
#   - Risky rows (missing venue/date, non-allowlisted host, support-act/festival
#     appearances, upsell packages) are withheld for human review, never written
#     and never auto-merged.
#   - event_name is the verbatim Ticketmaster Discovery API listing title;
#     tour_name is left blank on every new row (never inferred from a URL slug
#     or listing title, issue #172); the PR flags it as a human follow-up.
#   - Without TICKETMASTER_API_KEY the recogniser no-ops safely (no rows, no PR).
#   - Every discovered candidate is accounted for in the run's ingestion
#     observability artifacts (.tm-discovery/ingestion-outcomes.json and
#     ingestion-summary.md): exactly one result each — added, existing duplicate
#     or withheld — with a stable reason code for every non-added row, plus
#     totals by result and by reason. Diagnostics only; they change nothing
#     about what is published.
#
# See docs/PROVIDER_SYNC.md and SAFE_PUBLISHING_RULES.md.

on:
  schedule:
    # 04:00 UTC — after the 03:00 daily audit, separate from the (manual-only)
    # nightly data sync which historically ran at 03:30.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      artist:
        description: 'Single artist slug to run (blank = all approved sync-enabled artists).'
        required: false
        default: ''
      mode:
        description: 'preview = no PR (safe dry run); write-pr = open a review PR.'
        type: choice
        options:
          - preview
          - write-pr
        default: preview
      auto_merge:
        description: 'With write-pr: squash-merge the PR once the in-run validation suite has passed (scheduled runs always do this).'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# Never overlap with another run (a previous run may still hold the automation
# branch / be opening a PR). Queue rather than cancel so a scheduled run is not
# dropped mid-write.
concurrency:
  group: tm-new-shows-pr
  cancel-in-progress: false

jobs:
  new-shows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Ticketmaster new-shows write-to-PR
        id: discovery
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ARTIST: ${{ github.event.inputs.artist }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_AUTO_MERGE: ${{ github.event.inputs.auto_merge }}
        run: |
          set -euo pipefail
          ARGS=(--out-dir .tm-discovery)
          if [ -n "${INPUT_ARTIST:-}" ]; then
            ARGS+=(--artist "${INPUT_ARTIST}")
          else
            ARGS+=(--all-approved)
          fi
          # Scheduled runs open the PR and auto-merge it once the in-run
          # validation suite has passed (owner-approved 2026-07-07). Manual runs
          # honour the mode/auto_merge inputs and default to a safe preview.
          if [ "${EVENT_NAME}" = "schedule" ]; then
            ARGS+=(--write-pr --auto-merge)
          elif [ "${INPUT_MODE:-preview}" = "write-pr" ]; then
            ARGS+=(--write-pr)
            if [ "${INPUT_AUTO_MERGE:-false}" = "true" ]; then
              ARGS+=(--auto-merge)
            fi
          fi
          echo "Running: node scripts/sync-tm-events-write-pr.mjs ${ARGS[*]}"
          node scripts/sync-tm-events-write-pr.mjs "${ARGS[@]}"

      # Ingestion observability: render this run's per-candidate outcome summary
      # (added / existing duplicate / withheld, with stable reason codes and
      # totals) into the job summary. Runs on failure too — the outcomes file is
      # written before the apply/validation step, so a run that dies mid-write
      # still explains what it discovered instead of leaving only a red X.
      - name: Publish ingestion outcomes to the job summary
        if: always()
        run: |
          if [ -f .tm-discovery/ingestion-summary.md ]; then
            cat .tm-discovery/ingestion-summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Ticketmaster new-show ingestion" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "No ingestion outcomes were produced — the run failed before the recogniser report was partitioned." >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Heartbeat: maintain the rolling automation:tm-discovery coverage issue so
      # every full-roster run leaves a positive trace of which artists were checked
      # — and a failed/partial run (no coverage.json) is surfaced, not silent.
      # Targeted single-artist runs retain their artefact but do not overwrite the
      # full-roster heartbeat with intentionally out-of-scope artists marked absent.
      - name: Update discovery coverage heartbeat
        if: always() && (github.event_name == 'schedule' || (github.event.inputs.mode == 'write-pr' && github.event.inputs.artist == ''))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/report-tm-discovery-coverage.mjs \
            --coverage .tm-discovery/coverage.json \
            --repo "${GITHUB_REPOSITORY}"

      - name: Upload discovery coverage artefact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tm-discovery-coverage-${{ github.run_id }}
          path: .tm-discovery/
          include-hidden-files: true
          retention-days: 30
