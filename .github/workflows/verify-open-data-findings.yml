          const events = structuredClone(before);
          const selected = events.filter(e => ids.includes(e.id));
          assert(selected.length === ids.length && selected.every(e => e.artist_slug === "oasis"));
          const input = process.env.RUNNER_TEMP + "/oasis-review-input.json";
          const reportPath = process.env.RUNNER_TEMP + "/oasis-review-source.json";
          await fs.writeFile(input, JSON.stringify(selected));
          cmd(process.execPath, ["scripts/apply-tm-updates.mjs", "--dry-run", "--events", input, "--json", reportPath]);
          const report = JSON.parse(await fs.readFile(reportPath, "utf8"));
          assert(report.summary.checked === ids.length && report.errors.length === 0 && report.updates.length === 0);
          assert(report.reviewItems.length === ids.length && report.reviewItems.every(r => ids.includes(r.id) && r.kind === "status" && r.ticketmaster_status === "offsale"));
          const allowedFields = new Set(["organizer_names", "public_onsale_at"]);
          const applied = [];
          for (const item of report.reviewItems) {
            const event = events.find(e => e.id === item.id);
            assert(event.datetime_iso === item.ticketmaster_datetime_iso, "The source date moved; new review is required.");
            for (const change of item.intendedChanges || []) {
              assert(allowedFields.has(change.field), "Unexpected proposed field: " + change.field);
              assert.deepEqual(event[change.field] ?? null, change.from);
              if (change.field === "organizer_names") assert(Array.isArray(change.to) && change.to.length > 0 && change.to.every(n => typeof n === "string" && n.trim()));
              if (change.field === "public_onsale_at") assert(typeof change.to === "string" && Number.isFinite(Date.parse(change.to)));
              event[change.field] = change.to;
              applied.push({ id: event.id, ...change });
            }
          }
          assert(applied.length > 0);
          const allowedShards = new Set();
          const strip = e => { const x = structuredClone(e); for (const f of allowedFields) delete x[f]; return x; };
          for (let i = 0; i < events.length; i++) {
            assert.equal(events[i].id, before[i].id);
