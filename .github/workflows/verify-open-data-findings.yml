          const files = cmd("git", ["diff", "--name-only"]).trim().split("\n").filter(Boolean);
          for (const file of files) assert(allowedFiles.has(file), "Unexpected file: " + file);
          assert.equal(cmd("git", ["ls-files", "--others", "--exclude-standard"]).trim(), "");
          console.log(cmd("npm", ["run", "events:validate:prod"]));
          console.log(cmd("npm", ["run", "events:validate:partitions"]));
          console.log(cmd("npm", ["run", "test:providers"]));
          console.log(cmd("git", ["diff", "--check"]));
          assert.deepEqual(JSON.parse(await fs.readFile("public/data/events.json", "utf8")), events);
          for (const file of cmd("git", ["diff", "--name-only"]).trim().split("\n").filter(Boolean)) assert(allowedFiles.has(file));
          cmd("git", ["config", "user.name", "tourticketcompare-bot"]);
          cmd("git", ["config", "user.email", "tourticketcompare-bot@users.noreply.github.com"]);
          const branch = "codex/review-oasis-offsale-metadata-20261022";
          cmd("git", ["checkout", "-b", branch]);
          cmd("git", ["add", ...files]);
          console.log(cmd("git", ["diff", "--cached", "--stat"]));
          console.log(cmd("git", ["commit", "-m", "Apply source-confirmed metadata after reviewing seven Oasis dates"]));
          console.log(cmd("git", ["push", "origin", "HEAD:refs/heads/" + branch]));
          const outcome = { branch, head: cmd("git", ["rev-parse", "HEAD"]).trim(), ids, applied, checked_at: report.checked_at, decision: "retain", status: "offsale" };
          await fs.writeFile(process.env.RUNNER_TEMP + "/oasis-review-outcome.json", JSON.stringify(outcome, null, 2) + "\n");
          console.log("OASIS_REVIEW_OUTCOME=" + JSON.stringify(outcome));
