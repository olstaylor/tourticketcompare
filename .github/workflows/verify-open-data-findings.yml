name: Verify open data findings

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'opened' && github.head_ref == 'codex/verify-open-data-findings-2026-10-22' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 33278f8e95e7be99948753fdb3be0a96cc4319b0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
