name: Vivid normalized dual-write verification

# This intentionally does NOT replace vividseats-price-snapshots.yml.
# Dispatch the legacy workflow first, then use this to submit its same API
# representation to the normalized ingestion endpoint and run read-only parity.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivid-normalized-dual-write
  cancel-in-progress: false

jobs:
  dual-write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRICING_INGEST_URL: ${{ secrets.PRICING_INGEST_URL }}
      PRICING_INGEST_TOKEN: ${{ secrets.PRICING_INGEST_TOKEN }}
      IMPACT_VIVIDSEATS_ACCOUNT_SID: ${{ secrets.IMPACT_VIVIDSEATS_ACCOUNT_SID }}
      IMPACT_VIVIDSEATS_AUTH_TOKEN: ${{ secrets.IMPACT_VIVIDSEATS_AUTH_TOKEN }}
      IMPACT_VIVIDSEATS_PROGRAM_ID: ${{ secrets.IMPACT_VIVIDSEATS_PROGRAM_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unchanged legacy Vivid Impact snapshot writer
        run: npm run vividseats:prices:apply
      - name: Submit normalized Vivid observations from the same approved API lane
        run: node scripts/pricing/vivid-normalized.mjs
      - name: Check legacy-to-normalized parity
        run: node scripts/pricing/check-vivid-parity.mjs
