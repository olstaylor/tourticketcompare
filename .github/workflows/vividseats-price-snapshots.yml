name: Vivid Seats price snapshots

# Approved Vivid Seats price-feed ingestion for D1 provider_pricing_cache.
# Scheduled runs apply only when the approved feed and Cloudflare D1 secrets are configured.
# Missing secrets cause a safe successful no-op; no display, event, or CTA data is changed.

on:
  schedule:
    - cron: '47 */4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write snapshots to remote D1. Leave false for self-test + dry-run only.'
        type: boolean
        default: false
      limit:
        description: 'Optional max eligible Vivid Seats events to process.'
        type: string
        default: ''
      event_id:
        description: 'Optional single local event ID to process.'
        type: string
        default: ''
      database:
        description: 'D1 database name for apply mode.'
        type: string
        default: 'tourticketcompare-demand'

permissions:
  contents: read

concurrency:
  group: vividseats-price-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIVIDSEATS_PRICE_FEED_APPROVED: 'true'
      D1_DATABASE_NAME: ${{ github.event.inputs.database || 'tourticketcompare-demand' }}
      SNAPSHOT_LIMIT: ${{ github.event.inputs.limit || '' }}
      SNAPSHOT_EVENT_ID: ${{ github.event.inputs.event_id || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vivid Seats price snapshot self-test
        run: npm run vividseats:prices:self-test

      - name: Check approved-feed and D1 configuration
        id: configured
        env:
          VIVIDSEATS_PRICE_FEED_URL: ${{ secrets.VIVIDSEATS_PRICE_FEED_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${VIVIDSEATS_PRICE_FEED_URL}" ] && [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Approved Vivid Seats feed or Cloudflare D1 secrets are not configured; skipping snapshot ingestion safely."
          fi

      - name: Run Vivid Seats price snapshot dry-run
        if: steps.configured.outputs.configured == 'true'
        env:
          VIVIDSEATS_PRICE_FEED_URL: ${{ secrets.VIVIDSEATS_PRICE_FEED_URL }}
          VIVIDSEATS_PRICE_FEED_TOKEN: ${{ secrets.VIVIDSEATS_PRICE_FEED_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SNAPSHOT_LIMIT}" ]; then args+=(--limit "${SNAPSHOT_LIMIT}"); fi
          if [ -n "${SNAPSHOT_EVENT_ID}" ]; then args+=(--event-id "${SNAPSHOT_EVENT_ID}"); fi
          npm run vividseats:prices:dry-run -- "${args[@]}"

      - name: Run Vivid Seats price snapshot apply
        if: steps.configured.outputs.configured == 'true' && (github.event_name == 'schedule' || github.event.inputs.apply == 'true')
        env:
          VIVIDSEATS_PRICE_FEED_URL: ${{ secrets.VIVIDSEATS_PRICE_FEED_URL }}
          VIVIDSEATS_PRICE_FEED_TOKEN: ${{ secrets.VIVIDSEATS_PRICE_FEED_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          args=(--database "${D1_DATABASE_NAME}")
          if [ -n "${SNAPSHOT_LIMIT}" ]; then args+=(--limit "${SNAPSHOT_LIMIT}"); fi
          if [ -n "${SNAPSHOT_EVENT_ID}" ]; then args+=(--event-id "${SNAPSHOT_EVENT_ID}"); fi
          npm run vividseats:prices:apply -- "${args[@]}"

      - name: Confirm protected files/data were not modified
        run: |
          set -euo pipefail
          git diff --exit-code -- functions/api/out.js
          git diff --exit-code -- public/data/events.json
