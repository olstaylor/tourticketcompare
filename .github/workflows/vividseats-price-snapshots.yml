name: Vivid Seats price snapshots

# Owner-approved Vivid Seats price snapshots via the existing Impact
# Marketplace Products API. The job reads the exact Vivid production already
# verified in events.json, accepts only an unambiguous current price for that
# exact production, and writes timestamped D1 cache rows. It never scrapes
# Vivid Seats, changes events, or changes CTAs.
#
# Cadence rationale (2026-07-30): measured against provider_pricing_history,
# Vivid listed prices drift ~2.3%/hour, so widening the cron makes visitors
# see staler prices rather than skipping redundant writes. Two hours puts the
# average displayed price ~1h behind the provider. Actions minutes are not the
# budget (this repo is public, so standard runners are free); the cost is one
# Impact catalog request per verified event, ~215 per scheduled run.

on:
  schedule:
    - cron: '47 */2 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write snapshots to remote D1. Leave false for self-test + dry-run only.'
        type: boolean
        default: false
      limit:
        description: 'Optional max eligible Vivid Seats events to process.'
        type: string
        default: ''
      event_id:
        description: 'Optional single local event ID to process.'
        type: string
        default: ''
      database:
        description: 'D1 database name for apply mode.'
        type: string
        default: 'tourticketcompare-demand'

permissions:
  contents: read

concurrency:
  group: vividseats-price-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      D1_DATABASE_NAME: ${{ github.event.inputs.database || 'tourticketcompare-demand' }}
      SNAPSHOT_LIMIT: ${{ github.event.inputs.limit || '' }}
      SNAPSHOT_EVENT_ID: ${{ github.event.inputs.event_id || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vivid Seats Impact price snapshot self-test
        run: npm run vividseats:prices:self-test

      - name: Run provider pricing history prune self-test
        run: npm run prices:history:prune:self-test

      - name: Check Impact and D1 configuration
        env:
          IMPACT_VIVIDSEATS_ACCOUNT_SID: ${{ secrets.IMPACT_VIVIDSEATS_ACCOUNT_SID }}
          IMPACT_VIVIDSEATS_AUTH_TOKEN: ${{ secrets.IMPACT_VIVIDSEATS_AUTH_TOKEN }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_SID="${IMPACT_VIVIDSEATS_ACCOUNT_SID:-${IMPACT_ACCOUNT_SID:-}}"
          AUTH_TOKEN="${IMPACT_VIVIDSEATS_AUTH_TOKEN:-${IMPACT_AUTH_TOKEN:-}}"
          missing=0
          if [ -z "${ACCOUNT_SID}" ] || [ -z "${AUTH_TOKEN}" ]; then
            echo "::error::Impact Vivid Seats credentials are required."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Cloudflare D1 credentials are required."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            {
              echo "## Vivid Seats price snapshots"
              echo
              echo "Configuration incomplete. No provider requests or D1 writes were attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run Vivid Seats Impact price snapshot dry-run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply != 'true'
        env:
          IMPACT_VIVIDSEATS_ACCOUNT_SID: ${{ secrets.IMPACT_VIVIDSEATS_ACCOUNT_SID }}
          IMPACT_VIVIDSEATS_AUTH_TOKEN: ${{ secrets.IMPACT_VIVIDSEATS_AUTH_TOKEN }}
          IMPACT_VIVIDSEATS_PROGRAM_ID: ${{ secrets.IMPACT_VIVIDSEATS_PROGRAM_ID }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SNAPSHOT_LIMIT}" ]; then args+=(--limit "${SNAPSHOT_LIMIT}"); fi
          if [ -n "${SNAPSHOT_EVENT_ID}" ]; then args+=(--event-id "${SNAPSHOT_EVENT_ID}"); fi
          node scripts/snapshot-vividseats-prices.mjs --json "${args[@]}" | tee "$RUNNER_TEMP/vividseats-price-summary.json"

      - name: Run Vivid Seats Impact price snapshot apply
        if: github.event_name == 'schedule' || github.event.inputs.apply == 'true'
        env:
          IMPACT_VIVIDSEATS_ACCOUNT_SID: ${{ secrets.IMPACT_VIVIDSEATS_ACCOUNT_SID }}
          IMPACT_VIVIDSEATS_AUTH_TOKEN: ${{ secrets.IMPACT_VIVIDSEATS_AUTH_TOKEN }}
          IMPACT_VIVIDSEATS_PROGRAM_ID: ${{ secrets.IMPACT_VIVIDSEATS_PROGRAM_ID }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          args=(--database "${D1_DATABASE_NAME}")
          if [ -n "${SNAPSHOT_LIMIT}" ]; then args+=(--limit "${SNAPSHOT_LIMIT}"); fi
          if [ -n "${SNAPSHOT_EVENT_ID}" ]; then args+=(--event-id "${SNAPSHOT_EVENT_ID}"); fi
          node scripts/snapshot-vividseats-prices.mjs --apply --json "${args[@]}" | tee "$RUNNER_TEMP/vividseats-price-summary.json"

      - name: Publish Vivid Seats snapshot run summary
        if: always()
        run: |
          node --input-type=module - "$RUNNER_TEMP/vividseats-price-summary.json" <<'NODE'
          import fs from "node:fs";
          const file = process.argv[2];
          if (!fs.existsSync(file)) process.exit(0);
          const summary = JSON.parse(fs.readFileSync(file, "utf8"));
          const metrics = ["eligible", "fetched", "usable", "written", "skipped", "stale", "failed"];
          const rows = metrics.map((key) => `| ${key} | ${summary[key] ?? 0} |`).join("\n");
          const reason = summary.zero_row_reason || "—";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Vivid Seats price snapshots\n\n| Metric | Count |\n| --- | ---: |\n${rows}\n\n**Zero-row reason:** ${reason}\n`);
          if (summary.failed > 0) console.log(`::warning::${summary.failed} Vivid Seats observations failed.`);
          if (summary.zero_row_reason) console.log(`::notice::Vivid Seats zero-row reason: ${summary.zero_row_reason}`);
          NODE

      # Bounded retention for the append-only history table, on apply runs
      # only. Provider-scoped so it seeks the composite index; idempotent, so
      # after the first pass there is normally nothing older than the window.
      - name: Prune Vivid Seats history rows past the retention window
        if: github.event_name == 'schedule' || github.event.inputs.apply == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/prune-provider-pricing-history.mjs --provider vivid-seats --database "${D1_DATABASE_NAME}" --apply --json \
            | tee "$RUNNER_TEMP/vividseats-history-prune.json"
          node --input-type=module - "$RUNNER_TEMP/vividseats-history-prune.json" <<'NODE'
          import fs from "node:fs";
          const s = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### History retention\n\n| Days | Prunable | Deleted |\n| ---: | ---: | ---: |\n| ${s.retention_days} | ${s.prunable} | ${s.deleted} |\n`);
          NODE

      - name: Audit Vivid Seats cache freshness
        if: always() && (github.event_name == 'schedule' || github.event.inputs.apply == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute "${D1_DATABASE_NAME}" --remote --json --command "SELECT COUNT(*) AS total, SUM(CASE WHEN datetime(expires_at) > datetime('now') THEN 1 ELSE 0 END) AS fresh, SUM(CASE WHEN datetime(expires_at) <= datetime('now') THEN 1 ELSE 0 END) AS stale FROM provider_pricing_cache WHERE provider = 'vivid-seats' AND source = 'vividseats_impact_marketplace_api';" > "$RUNNER_TEMP/vividseats-cache-audit.json"
          node --input-type=module - "$RUNNER_TEMP/vividseats-cache-audit.json" <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const root = Array.isArray(payload) ? payload[0] : payload;
          const row = root?.results?.[0] || {};
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### D1 cache after run\n\n| Fresh | Stale | Total |\n| ---: | ---: | ---: |\n| ${row.fresh ?? 0} | ${row.stale ?? 0} | ${row.total ?? 0} |\n`);
          NODE

      - name: Confirm protected files/data were not modified
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- functions/api/out.js
          git diff --exit-code -- public/data/events.json
