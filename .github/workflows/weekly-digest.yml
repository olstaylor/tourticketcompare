name: Weekly presale digest

# Sends the weekly presale and on-sale email to signups who ticked the optional
# updates box (scripts/send-weekly-digest.mjs). Manual only: there is
# deliberately no schedule until the owner has reviewed test sends and decided
# to run it automatically.
#
# preview  lists what this week's email would contain and how many people are
#          due; sends and writes nothing
# test     sends this week's email to test_to; records nothing
# send     sends this week's email to everyone due, up to `limit` per run, and
#          records each in D1 so no one gets the same week twice

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview, test or send"
        required: true
        type: choice
        options: [preview, test, send]
        default: preview
      test_to:
        description: "Recipient for a test send"
        required: false
        default: ""
      limit:
        description: "Most emails one send run sends (rerun to send the rest)"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: date-alerts
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run weekly digest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Not a credential; same default as date-alerts.yml.
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM || 'TourTicketCompare <alerts@tourticketcompare.com>' }}
          ALERT_POSTAL_ADDRESS: ${{ secrets.ALERT_POSTAL_ADDRESS }}
          ALERT_REPLY_TO: ${{ secrets.ALERT_REPLY_TO }}
          MODE: ${{ inputs.mode }}
          TEST_TO: ${{ inputs.test_to }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--mode "$MODE" --limit "${LIMIT:-500}")
          if [ "$MODE" = "test" ]; then args+=(--test-to "$TEST_TO"); fi
          node scripts/send-weekly-digest.mjs "${args[@]}"
