name = "tourticketcompare"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[vars]
MOCK_MODE = "false"
ALLOW_MOCK_PRICES = "false"
CACHE_TTL_MINUTES = "60"
TICKETMASTER_DAILY_CAP = "1000"
TICKETMASTER_STALE_TTL_HOURS = "168"
CLICK_TRACKING_ENABLED = "true"
# Impact's authorised publisher link generator exposes this as “Sub Id 1”.
# The opaque TTC click_id is therefore safe to pass through for reconciliation.
OUT_CLICK_ID_SUBID_ENABLED = "true"
OUT_CLICK_ID_SUBID_PARAM = "subId1"
TICKETMASTER_DISCOVERY_ENABLED = "true"
TICKETMASTER_EVENTS_TTL_MINUTES = "30"
TICKETMASTER_ARTIST_EVENTS_LIMIT = "100"
TICKETMASTER_DISCOVERY_PRICE_CHECKS_ENABLED = "false"
SEATGEEK_PRICE_DISPLAY_ENABLED = "true"
VIVIDSEATS_PRICE_DISPLAY_ENABLED = "true"
TICKETNETWORK_PUBLIC_ENABLED = "true"
TICKETNETWORK_PRICE_DISPLAY_ENABLED = "true"
TICKETLIQUIDATOR_PUBLIC_ENABLED = "true"
TICKETLIQUIDATOR_PRICE_DISPLAY_ENABLED = "false"
STUBHUB_INTERNATIONAL_PUBLIC_ENABLED = "true"
STUBHUB_INTERNATIONAL_PRICE_DISPLAY_ENABLED = "true"
TICKETMASTER_DISCOVERY_COUNTRY = ""
# Schema-offers exception (SAFE_PUBLISHING_RULES.md, owner-approved 2026-07-22).
# Site-wide since the harry-styles pilot was verified live (2026-07-22). To
# re-scope, set SCHEMA_OFFERS_PILOT_SLUGS (comma-separated slugs); set
# SCHEMA_OFFERS_ENABLED = "false" to stop emitting at origin.
SCHEMA_OFFERS_ENABLED = "true"

# Optional D1 bindings for CLI-based deploys and local Pages dev.
# Configure these in the Cloudflare dashboard for Git-connected Pages deploys.
#
[[d1_databases]]
binding = "DEMAND_DB"
database_name = "tourticketcompare-demand"
database_id = "19b314b8-10f1-4504-a3bc-963f7ecbe9f6"
